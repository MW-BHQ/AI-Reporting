<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic Explorer · Bangkok Hospital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1417;--surface:#161D21;--surface-2:#1D262B;--line:#2A3439;
    --ink:#E9EEEE;--muted:#8CA0A6;--faint:#5C6E73;--amber:#E8A33D;
    --sc:#E8C15A;--good:#7FD1AE;--bad:#E8746A;--violet:#9B8CEF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 60px;}
  .topbar{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px;}
  .brand-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 6px;}
  h1{font-size:26px;font-weight:600;margin:0;letter-spacing:-.01em;}
  nav{margin-top:10px;display:flex;gap:14px;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  nav a{text-decoration:none;color:var(--muted);}
  nav a.active{color:var(--violet);border-bottom:1px solid var(--violet);padding-bottom:2px;}
  .search-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
  .topic-input{flex:1;min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;color:var(--ink);font-size:15px;font-family:'IBM Plex Sans',sans-serif;}
  .topic-input:focus{outline:none;border-color:var(--violet);}
  .date-inputs{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;}
  .date-inputs input{background:transparent;border:none;color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:12px;color-scheme:dark;width:112px;}
  .date-inputs span{color:var(--faint);}
  .go-btn{background:var(--violet);color:#141024;border:none;border-radius:9px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;padding:12px 20px;cursor:pointer;display:flex;align-items:center;gap:8px;}
  .go-btn:hover{filter:brightness(1.08);}.go-btn:disabled{opacity:.5;cursor:wait;}
  .spinner{width:12px;height:12px;border-radius:50%;border:2px solid #141024;border-top-color:transparent;animation:spin .7s linear infinite;display:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .go-btn.loading .spinner{display:inline-block;}
  .hint{font-size:12px;color:var(--faint);margin:0 0 22px;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
  .chip-btn{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:5px 13px;font-size:12px;cursor:pointer;font-family:'IBM Plex Mono',monospace;}
  .chip-btn:hover{color:var(--ink);border-color:var(--violet);}
  .summary{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .stat .l{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin-bottom:7px;}
  .stat .v{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 14px;font-weight:600;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .cluster{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;}
  .cluster h3{margin:0 0 10px;font-size:13px;color:var(--violet);font-weight:600;}
  .qtag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 9px;margin:0 6px 6px 0;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--faint);font-weight:500;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding-bottom:8px;border-bottom:1px solid var(--line);}
  td{padding:7px 0;border-bottom:1px solid var(--line);}
  td.num{font-family:'IBM Plex Mono',monospace;text-align:right;color:var(--muted);}
  tr:last-child td{border-bottom:none;}
  .langtag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);}
  .gap-tag{display:inline-block;border:1px dashed var(--bad);color:var(--bad);border-radius:6px;padding:4px 9px;margin:0 6px 6px 0;font-size:12px;}
  .state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--muted);text-align:center;gap:10px;}
  .state.error{color:var(--bad);}
  .state button{margin-top:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:8px 14px;font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;}
  .caveat{font-size:11.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:10px;margin-top:6px;}
  @media(max-width:900px){.summary{grid-template-columns:repeat(2,1fr);}.grid2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <p class="brand-eyebrow">Bangkok Hospital · Marketing Division</p>
    <h1>Topic Explorer</h1>
    <nav>
      <a href="/">Overview</a>
      <a href="/topic.html" class="active">Topic Explorer</a>
    </nav>
  </div>

  <div class="search-row">
    <input class="topic-input" id="topicInput" placeholder="Enter a clinical topic, e.g. gallbladder" autocomplete="off">
    <div class="date-inputs">
      <input type="date" id="fromDate">
      <span>&rarr;</span>
      <input type="date" id="toDate">
    </div>
    <button class="go-btn" id="goBtn"><span class="spinner"></span><span id="goLabel">Explore</span></button>
  </div>
  <p class="hint">Claude expands the topic across Arabic, Japanese, Chinese, Burmese, Khmer, Thai &amp; English, then matches it against what bangkokhospital.com actually ranks for in Search Console.</p>
  <div class="chips" id="examples">
    <button class="chip-btn" data-t="gallbladder">gallbladder</button>
    <button class="chip-btn" data-t="heart disease">heart disease</button>
    <button class="chip-btn" data-t="cancer screening">cancer screening</button>
    <button class="chip-btn" data-t="knee replacement">knee replacement</button>
  </div>

  <div id="content"></div>
</div>

<script>
const topicInput=document.getElementById('topicInput');
const fromInput=document.getElementById('fromDate');
const toInput=document.getElementById('toDate');
const goBtn=document.getElementById('goBtn');
const goLabel=document.getElementById('goLabel');
const content=document.getElementById('content');

function fmt(d){return d.toISOString().slice(0,10);}
(function initDates(){const to=new Date();const from=new Date();from.setDate(to.getDate()-89);fromInput.value=fmt(from);toInput.value=fmt(to);})();
document.getElementById('examples').addEventListener('click',e=>{const b=e.target.closest('.chip-btn');if(!b)return;topicInput.value=b.dataset.t;explore();});
topicInput.addEventListener('keydown',e=>{if(e.key==='Enter')explore();});
goBtn.addEventListener('click',explore);

function numFmt(x){if(x==null||isNaN(x))return '\u2014';if(Math.abs(x)>=1e6)return (x/1e6).toFixed(1)+'M';if(Math.abs(x)>=1e3)return (x/1e3).toFixed(1)+'K';return (Math.round(x*10)/10)+'';}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function renderLoading(t){content.innerHTML=`<div class="state"><div class="mono" style="font-size:13px;">Exploring \u201c${esc(t)}\u201d\u2026</div><div style="font-size:12px;max-width:420px;">Expanding terms across 7 languages, pulling Search Console, then clustering. Usually 10\u201325s.</div></div>`;}
function renderError(msg){content.innerHTML=`<div class="state error"><div class="mono" style="font-size:13px;">Exploration failed</div><div style="font-size:12.5px;max-width:440px;">${esc(msg)}</div><button onclick="explore()">Retry</button></div>`;}

function render(d){
  const s=d.summary||{};
  const langRows=(d.byLanguage||[]).map(l=>`<tr><td>${esc(l.name)} <span class="langtag">${esc(l.lang)}</span></td><td class="num">${numFmt(l.queries)}</td><td class="num">${numFmt(l.clicks)}</td><td class="num">${numFmt(l.impressions)}</td></tr>`).join('')||'<tr><td colspan="4" class="num">no matches</td></tr>';
  const countryRows=(d.byCountry||[]).map(c=>`<tr><td class="mono">${esc(c.country)}</td><td class="num">${numFmt(c.clicks)}</td><td class="num">${numFmt(c.impressions)}</td></tr>`).join('')||'<tr><td colspan="3" class="num">no matches</td></tr>';
  const clusterHtml=(d.clusters||[]).map(cl=>`<div class="cluster"><h3>${esc(cl.label)}</h3>${(cl.queries||[]).map(q=>`<span class="qtag">${esc(q)}</span>`).join('')}</div>`).join('')||'<div style="color:var(--faint);font-size:12.5px;">No clusters (either no matched queries, or clustering was skipped).</div>';
  const gapHtml=(d.gaps||[]).length?`<div class="panel"><h2>Opportunity gaps \u2014 terms with no captured ranking</h2>${d.gaps.map(g=>`<span class="gap-tag">${esc(g.term)} <span class="langtag">${esc(g.lang)}</span></span>`).join('')}<div class="caveat">Search Console only reports queries above Google\u2019s impression threshold, so \u201cno captured ranking\u201d means not captured \u2014 not proof you don\u2019t rank at all. Treat these as content leads to verify, and remember the term list is AI-generated: review before acting.</div></div>`:'';
  const matchedRows=(d.matched||[]).slice(0,40).map(m=>`<tr><td>${esc(m.query)}</td><td class="langtag">${esc(m.lang)}</td><td class="num">${numFmt(m.clicks)}</td><td class="num">${numFmt(m.impressions)}</td><td class="num">${m.position??'\u2014'}</td></tr>`).join('')||'<tr><td colspan="5" class="num">no matched queries in this range</td></tr>';

  content.innerHTML=`
    <div class="summary">
      <div class="stat"><div class="l">Matched Queries</div><div class="v">${numFmt(s.matchedQueries)}</div></div>
      <div class="stat"><div class="l">Clicks</div><div class="v">${numFmt(s.totalClicks)}</div></div>
      <div class="stat"><div class="l">Impressions</div><div class="v">${numFmt(s.totalImpressions)}</div></div>
      <div class="stat"><div class="l">Languages</div><div class="v">${numFmt(s.languages)}</div></div>
      <div class="stat"><div class="l">Countries</div><div class="v">${numFmt(s.countries)}</div></div>
      <div class="stat"><div class="l">Terms Generated</div><div class="v">${numFmt(s.termsGenerated)}</div></div>
    </div>
    <div class="panel"><h2>Sub-topics</h2>${clusterHtml}</div>
    <div class="grid2">
      <div class="panel"><h2>By language</h2><table><thead><tr><th>Language</th><th style="text-align:right">Queries</th><th style="text-align:right">Clicks</th><th style="text-align:right">Impr</th></tr></thead><tbody>${langRows}</tbody></table></div>
      <div class="panel"><h2>By country</h2><table><thead><tr><th>Country</th><th style="text-align:right">Clicks</th><th style="text-align:right">Impr</th></tr></thead><tbody>${countryRows}</tbody></table></div>
    </div>
    ${gapHtml}
    <div class="panel"><h2>Top matched queries</h2><table><thead><tr><th>Query</th><th>Lang</th><th style="text-align:right">Clicks</th><th style="text-align:right">Impr</th><th style="text-align:right">Pos</th></tr></thead><tbody>${matchedRows}</tbody></table></div>
  `;
}

async function explore(){
  const topic=topicInput.value.trim();
  if(!topic){topicInput.focus();return;}
  const from=fromInput.value,to=toInput.value;
  goBtn.disabled=true;goBtn.classList.add('loading');goLabel.textContent='Working\u2026';
  renderLoading(topic);
  try{
    const res=await fetch('/api/topic',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({topic,from,to})});
    if(!res.ok){const t=await res.text();throw new Error(`Server ${res.status}: ${t.slice(0,200)}`);}
    render(await res.json());
  }catch(err){console.error(err);renderError(err.message||'Unknown error');}
  finally{goBtn.disabled=false;goBtn.classList.remove('loading');goLabel.textContent='Explore';}
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BHQ Signal Room · Bangkok Hospital</title>
<link rel="icon" type="image/png" href="/brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Chart.js stays self-hosted: a blocked CDN here breaks the page, not just the type. -->
<script src="/vendor/chart.umd.js"></script>
<style>
  /* Fonts: Poppins (Latin) + Sarabun (Thai) from Google Fonts CDN.
     Google's own CSS carries per-subset unicode-range, so Sarabun only claims
     Thai codepoints and Poppins keeps Latin. If the CDN is ever blocked the
     page degrades to a system font — cosmetic only, nothing breaks. */

  :root{
    --bg:#EEF2FB;
    --bg-2:#E4EAF7;
    --glass:rgba(255,255,255,.72);
    --glass-2:rgba(255,255,255,.55);
    --stroke:rgba(255,255,255,.85);
    --line:rgba(90,110,160,.14);
    --ink:#1B2340;
    --ink-2:#4C5878;
    --muted:#8590AC;
    --faint:#A7B0C7;
    --violet:#7C6BF5;
    --violet-soft:#EDEAFE;
    --blue:#4B8DF8;
    --teal:#35C3B4;
    --amber:#F2A93B;
    --rose:#F2708F;
    --green:#3BC97F;
    --shadow:0 8px 30px rgba(43,60,110,.09);
    --shadow-sm:0 2px 10px rgba(43,60,110,.06);
    --r:18px;
    --r-sm:12px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 700px at 88% -12%, #DCE6FF 0%, rgba(220,230,255,0) 60%),
      radial-gradient(900px 600px at -8% 8%, #E8E3FF 0%, rgba(232,227,255,0) 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Poppins','Sarabun',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:14px;
  }
  /* Thai and other scripts fall through Poppins to Sarabun, then system */
  .i18n{font-family:'Poppins','Sarabun',system-ui,'Noto Sans Thai','Noto Sans JP','Noto Sans Arabic','Noto Sans Myanmar','Noto Sans Khmer',sans-serif;}

  .shell{display:flex;min-height:100vh;}

  /* ---------------- left rail ---------------- */
  .rail{
    width:236px;flex:none;padding:22px 16px;
    display:flex;flex-direction:column;gap:18px;
    background:var(--glass);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-right:1px solid var(--line);
    position:sticky;top:0;height:100vh;overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  }
  .rail::-webkit-scrollbar{width:6px;}
  .rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .brand{display:flex;flex-direction:column;gap:12px;padding:2px 8px 0;}
  .brand-logo{width:150px;height:auto;display:block;}
  .brand-app{padding-top:11px;border-top:1px solid var(--line);}
  .brand-name{font-weight:600;font-size:14.5px;line-height:1.15;}
  .brand-sub{font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;}

  /* The nav scrolls on short screens; brand and footer stay put. Without
     min-height:0 a flex child refuses to shrink and the list is clipped
     instead of scrolling. */
  .nav{display:flex;flex-direction:column;gap:4px;flex:none;}
  .nav-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:0 10px 6px;}
  .nav-sep{height:1px;background:var(--line);margin:7px 10px;}
  /* "Meta Ads" is a heading, not a destination — no data-view, so the click
     handler ignores it. */
  .nav-group{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
    padding:8px 10px 3px;font-weight:600;}
  .nav-item.sub{margin-left:12px;}
  .nav-item{
    display:flex;align-items:center;gap:11px;
    padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;
    color:var(--ink-2);font-size:13.5px;font-weight:500;
    border:1px solid transparent;transition:.16s;
  }
  .nav-item:hover{background:var(--glass-2);color:var(--ink);}
  .nav-item.active{
    background:#fff;color:var(--violet);border-color:var(--stroke);
    box-shadow:var(--shadow-sm);font-weight:600;
  }
  .nav-item svg{width:17px;height:17px;flex:none;}

  .rail-foot{flex:none;margin-top:18px;padding:12px;border-radius:var(--r-sm);background:var(--glass-2);border:1px solid var(--line);}
  .rail-foot .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);}
  .rail-foot .v{font-size:12px;color:var(--ink-2);margin-top:3px;}

  /* ---------------- main ---------------- */
  .main{flex:1;min-width:0;padding:26px 30px 60px;}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:20px;}
  h1{font-size:25px;font-weight:600;margin:0;letter-spacing:-.02em;}
  .subtitle{color:var(--muted);font-size:13px;margin-top:3px;}

  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .seg{display:flex;gap:3px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:4px;backdrop-filter:blur(10px);}
  .seg button{
    border:none;background:transparent;color:var(--ink-2);font-family:inherit;
    font-size:12px;font-weight:500;padding:7px 12px;border-radius:9px;cursor:pointer;transition:.15s;
  }
  .seg button:hover{color:var(--ink);}
  .seg button.active{background:#fff;color:var(--violet);font-weight:600;box-shadow:var(--shadow-sm);}
  .dates{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:7px 11px;}
  .dates input{background:transparent;border:none;color:var(--ink);font-family:inherit;font-size:12px;width:104px;}
  .dates input:focus{outline:none;}
  .dates span{color:var(--faint);}
  .btn{
    border:none;border-radius:12px;font-family:inherit;font-size:12.5px;font-weight:600;
    padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s;
  }
  .btn-primary{background:linear-gradient(135deg,var(--violet),#6A7BF7);color:#fff;box-shadow:0 4px 14px rgba(124,107,245,.32);}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-primary:disabled{opacity:.55;cursor:wait;}
  .btn-ghost{background:var(--glass);border:1px solid var(--line);color:var(--ink-2);}
  .spin{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;animation:sp .7s linear infinite;display:none;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .btn.loading .spin{display:inline-block;}

  .status{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;}
  .dot.idle{background:var(--faint);}
  .dot.busy{background:var(--amber);}
  .dot.bad{background:var(--rose);}

  /* ---------------- cards ---------------- */
  .card{
    background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);
    box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    padding:18px 20px;
  }
  .card h2{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;}
  .grid{display:grid;gap:14px;}
  .g-4{grid-template-columns:repeat(4,1fr);}
  .g-5{grid-template-columns:repeat(5,1fr);}
  .g-3{grid-template-columns:repeat(3,1fr);}
  .g-2-1{grid-template-columns:1.6fr 1fr;}
  .mt{margin-top:14px;}

  .stat .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);display:flex;align-items:center;gap:6px;}
  .stat .val{font-size:23px;font-weight:600;margin-top:7px;letter-spacing:-.02em;}
  .stat .val.na{color:var(--faint);font-weight:500;font-size:19px;}
  .stat .sub{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .chip{width:7px;height:7px;border-radius:50%;display:inline-block;}

  /* ---------------- funnel ---------------- */
  .stage{margin-bottom:16px;}
  .stage:last-child{margin-bottom:0;}
  .stage-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
  .stage-name{font-size:12.5px;font-weight:600;}
  .stage-val{font-size:16px;font-weight:600;}
  .stage-val.na{color:var(--faint);font-size:13px;font-weight:500;}
  .bar{display:flex;height:30px;border-radius:9px;overflow:hidden;background:rgba(140,155,190,.13);}
  .bar span{display:block;height:100%;transition:width .5s cubic-bezier(.4,0,.2,1);position:relative;}
  .bar span:hover{filter:brightness(1.08);}
  .seg-val{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);pointer-events:none;white-space:nowrap;}
  .stage.minor .seg-val{font-size:9px;right:4px;}
  .stage-note{font-size:10.5px;color:var(--faint);margin-top:5px;}
  /* Minor stages read as supporting context, not headline numbers. */
  .stage.minor{padding-left:16px;border-left:2px solid rgba(140,155,190,.22);margin-bottom:14px;}
  .stage.minor .stage-name{font-weight:500;font-size:11.5px;color:var(--muted);}
  .stage.minor .stage-val{font-size:13px;font-weight:500;color:var(--muted);}
  .stage.minor .bar{height:16px;border-radius:6px;background:rgba(140,155,190,.10);}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);}
  .legend div{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);}

  /* ---------------- tables ---------------- */
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--muted);font-weight:500;font-size:11.5px;letter-spacing:0;padding:0 8px 9px 0;border-bottom:1px solid var(--line);white-space:nowrap;}
  th.num{text-align:right;padding-right:0;}
  /* Long ad/campaign names truncate; the full string is on hover. */
  td.trunc{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  td.trunc:hover{cursor:help;}
  td{padding:9px 0;border-bottom:1px solid var(--line);color:var(--ink-2);}
  td.strong{color:var(--ink);font-weight:500;}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  tr:last-child td{border-bottom:none;}
  tr.grp td{
    background:rgba(124,107,245,.05);color:var(--muted);
    font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:600;
    padding:8px 0 8px 10px;border-bottom:1px solid var(--line);
  }
  tr.tot td{font-weight:600;color:var(--ink);border-top:2px solid var(--line);background:rgba(140,155,190,.05);}
  td.dim{color:var(--faint);opacity:.5;}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:500;background:var(--violet-soft);color:var(--violet);}
  .pill.warn{background:#FFF1E6;color:#D97B1F;}
  .pill.grey{background:rgba(140,155,190,.14);color:var(--muted);}
  .ihint{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;margin-left:4px;
    border-radius:50%;background:rgba(140,155,190,.2);color:var(--muted);font-size:9px;font-style:italic;
    font-weight:700;cursor:help;vertical-align:middle;}
  .ihint:hover{background:var(--violet);color:#fff;}
  /* Q/E/C: header letters and the dot cells share one fixed column width, so
     each dot sits directly under its letter. */
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;}
  .legend .lg{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
  .legend .lg i{width:9px;height:9px;border-radius:2.5px;display:inline-block;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .seg button{border:0;background:transparent;padding:5px 12px;font-size:11.5px;color:var(--muted);
    cursor:pointer;font-family:inherit;}
  .seg button.on{background:var(--violet);color:#fff;font-weight:500;}
  .swatch{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:7px;}
  .minibar{position:absolute;right:0;top:50%;transform:translateY(-50%);height:20px;
    background:var(--violet-soft);border-radius:4px;z-index:0;}
  td.barcell{position:relative;}
  td.barcell b{position:relative;}
  .stat .sub2{font-size:10.5px;color:var(--faint);margin-top:2px;}
  td.num.bad{color:#D9534F;font-weight:600;} td.num.good{color:#2E9E6F;font-weight:600;}
  .qec-head,.qec{display:inline-flex;align-items:center;}
  .qec-head b{width:38px;text-align:center;font-weight:600;color:var(--muted);}
  .qec-cell{width:38px;display:inline-flex;align-items:center;justify-content:center;
    color:var(--faint);font-size:10.5px;cursor:help;position:relative;}
  .qec-cell em{font-style:normal;color:#D97B1F;font-weight:600;position:absolute;
    left:calc(50% + 7px);top:50%;transform:translateY(-50%);}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;}
  .dot.d-good{background:#2E9E6F;}
  .dot.d-mid{background:#A9B4CE;}
  .dot.d-warn{background:#E8A33D;}
  .dot.d-bad{background:#D9534F;}
  /* Floating tooltip: appended to <body> so a table's overflow can never clip
     it, and shown instantly instead of waiting for the browser's title delay. */
  #tip{position:fixed;z-index:9999;max-width:340px;padding:9px 11px;border-radius:9px;
    background:#2A3350;color:#fff;font-size:11.5px;line-height:1.55;font-weight:400;
    box-shadow:0 8px 24px rgba(20,28,55,.28);pointer-events:none;opacity:0;transition:opacity .12s;
    white-space:pre-line;text-align:left;letter-spacing:0;}
  #tip.on{opacity:1;}
  /* Sticky header for the wide audience table, so the columns stay identified
     while scrolling. Cells need their own background or rows show through. */
  table.sticky-head{table-layout:fixed;}
  table.sticky-head thead th{position:sticky;top:0;z-index:3;background:var(--card, #FBFCFE);
    padding-top:9px;box-shadow:inset 0 -1px 0 var(--line);}
  table.sticky-head thead th{text-align:center;}
  table.sticky-head thead th:first-child{text-align:left;}
  .pill.green{background:rgba(74,190,140,.14);color:#2E9E6F;}
  .pill.violet{background:var(--violet-soft);color:var(--violet);}

  /* ---------------- topic / campaign inputs ---------------- */
  .search{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .search input.text{
    flex:1;min-width:230px;background:#fff;border:1px solid var(--line);border-radius:13px;
    padding:12px 15px;color:var(--ink);font-family:inherit;font-size:14px;box-shadow:var(--shadow-sm);
  }
  .search input.text:focus{outline:none;border-color:var(--violet);}
  .hint{font-size:11.5px;color:var(--muted);margin:0 0 14px;}
  .tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
  .tag{background:var(--glass);border:1px solid var(--line);color:var(--ink-2);border-radius:20px;padding:6px 13px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s;}
  .tag:hover{border-color:var(--violet);color:var(--violet);}
  .qtag{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px;margin:0 6px 6px 0;font-size:12px;}
  .gap-tag{display:inline-block;border:1px dashed var(--rose);color:var(--rose);border-radius:8px;padding:5px 10px;margin:0 6px 6px 0;font-size:12px;background:#FFF7F9;}
  .cluster{background:var(--glass-2);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px;}
  .cluster h3{margin:0 0 10px;font-size:13px;color:var(--violet);font-weight:600;}

  .state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 20px;gap:9px;text-align:center;color:var(--muted);}
  .state .big{font-size:14px;font-weight:600;color:var(--ink-2);}
  .state.bad .big{color:var(--rose);}
  .note{font-size:11.5px;color:var(--faint);margin-top:12px;padding-top:11px;border-top:1px solid var(--line);}
  .warnbox{background:#FFF8EC;border:1px solid #FBE3BE;color:#9A6712;border-radius:12px;padding:11px 14px;font-size:12px;margin-bottom:14px;}
  .chart-wrap{height:250px;}
  .hidden{display:none!important;}

  /* ---------------- print / PDF: 16:9 presentation ---------------- */
  .acct-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:2px;}
  .acct-tab{
    background:var(--glass);border:1px solid var(--line);color:var(--ink-2);
    border-radius:11px;padding:8px 13px;font-family:inherit;font-size:12px;cursor:pointer;transition:.15s;
    display:flex;align-items:baseline;gap:7px;
  }
  .acct-tab:hover{border-color:var(--violet);}
  .acct-tab.active{background:#fff;color:var(--violet);font-weight:600;border-color:var(--stroke);box-shadow:var(--shadow-sm);}
  .acct-tab small{font-size:10.5px;color:var(--faint);font-weight:400;}
  .acct-tab.active small{color:var(--violet);opacity:.75;}

  .print-head{display:none;}
  @media print{
    /* 13.333in x 7.5in is the standard 16:9 slide canvas. */
    @page{size:13.333in 7.5in;margin:0.45in;}
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
    body{background:#fff!important;font-size:11px;}
    .rail,.toolbar,.status,.search,.tags,.btn,#loadBtn,.no-print,.acct-tabs{display:none!important;}
    .shell{display:block;}
    .main{padding:0!important;}
    .head{margin-bottom:10px;border-bottom:1px solid #d8dfee;padding-bottom:8px;}
    h1{font-size:20px;}
    .print-head{
      display:flex!important;align-items:center;justify-content:space-between;
      gap:14px;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid #1B2340;
    }
    .print-head img{width:132px;height:auto;}
    .print-head .pmeta{text-align:right;font-size:10.5px;color:#4C5878;line-height:1.5;}
    .card{
      background:#fff!important;box-shadow:none!important;backdrop-filter:none!important;
      border:1px solid #dde3f0!important;border-radius:10px;padding:12px 14px;
      break-inside:avoid;page-break-inside:avoid;
    }
    .grid{gap:10px;break-inside:avoid;page-break-inside:avoid;}
    .mt{margin-top:10px;}
    .stat .val{font-size:17px;}
    .chart-wrap{height:150px;}
    /* Keep a campaign report to a single slide. */
    .card h2{font-size:10.5px;margin-bottom:8px;}
    .stat .lab{font-size:8.5px;}
    .stat .sub{font-size:8px;}
    table{font-size:10px;}
    td,th{padding:5px 0;}
    td.trunc{max-width:200px;}
    .note,.stage-note{font-size:9px;}
    /* Force a new slide before these blocks so sections don't split awkwardly. */
    .slide-break{break-before:page;page-break-before:always;}
    a{color:#1B2340!important;text-decoration:none!important;}
  }

  @media(max-width:1080px){.g-5,.g-4{grid-template-columns:repeat(2,1fr);}.g-2-1,.g-3{grid-template-columns:1fr;}}
  @media(max-width:760px){
    .shell{flex-direction:column;}
    .rail{width:auto;height:auto;position:static;flex-direction:row;align-items:center;gap:14px;overflow-x:auto;}
    .nav{flex-direction:row;overflow-y:visible;flex:0 0 auto;}.nav-label,.nav-sep,.nav-group,.rail-foot,.brand-app{display:none;}
    .nav-item.sub{margin-left:0;}
    .brand{flex-direction:row;padding:0;}.brand-logo{width:112px;}
    .main{padding:18px 16px 40px;}
  }
</style>
</head>
<body>
<div class="shell">
  <!-- ================= left rail ================= -->
  <aside class="rail">
    <div class="brand">
      <img class="brand-logo" src="/brand/bh-wordmark.png" alt="Bangkok Hospital">
      <div class="brand-app">
        <div class="brand-name">BHQ Signal Room</div>
        <div class="brand-sub">Marketing Intelligence</div>
      </div>
    </div>

    <nav class="nav">
      <div class="nav-label">Reporting</div>
      <div class="nav-item active" data-view="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
        Overview
      </div>

      <div class="nav-sep"></div>
      <div class="nav-item" data-view="gbp">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6L3.4 9.4l6-.8z"/></svg>
        Google Profile
      </div>

      <div class="nav-sep"></div>
      <div class="nav-item" data-view="campaigns">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>
        Campaigns
      </div>
      <div class="nav-group">Meta Ads</div>
      <div class="nav-item sub" data-view="benchmark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        Benchmarks

<script>
// ============================================================ state & helpers
const S = {

  campaign: null, campaignCode: '',
  campaignList: null, campaignListKey: null,

  audit: null, auditKey: null,
  bench: null, benchKey: null, benchTab: null,
  gbp: null, gbpKey: null, gbpTab: null, gbpInit: false,

  ecom: null, ecomKey: null, ecomLoading: false, ecomError: null, ecomScope: 'online',
  ecomc: null, ecomcKey: null, ecomcLoading: false, ecomcError: null,
  audiencesLoading: false, audiencesError: null,
  me: null, users: null,

const $ = (id) => document.getElementById(id);

/**
 * Tooltips for anything carrying data-tip. Delegated from document, so it keeps
 * working after any re-render, and positioned in fixed coordinates against the
 * viewport so table overflow cannot clip it.
 */
(function tooltips() {
  let el;
  const show = (target) => {
    el = el || $('tip');
    el.textContent = target.getAttribute('data-tip');
    el.classList.add('on');
    const r = target.getBoundingClientRect();
    const t = el.getBoundingClientRect();
    let left = r.left + r.width / 2 - t.width / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - t.width - 8));
    // Prefer below; flip above when there is no room.
    let top = r.bottom + 8;
    if (top + t.height > window.innerHeight - 8) top = r.top - t.height - 8;
    el.style.left = left + 'px';
    el.style.top = Math.max(8, top) + 'px';
  };
  const hide = () => { if (el) el.classList.remove('on'); };
  document.addEventListener('mouseover', (e) => {
    const t = e.target.closest('[data-tip]');
    if (t) show(t); else hide();
  });
  document.addEventListener('mouseout', (e) => { if (e.target.closest('[data-tip]')) hide(); });
  document.addEventListener('scroll', hide, true);
})();

const fmtISO = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/** null means "we could not measure this" — render as an em dash, never 0. */
function num(v, opts = {}) {
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  const a = Math.abs(v);
  if (opts.money) {
    if (a >= 1e6) return '฿' + (v/1e6).toFixed(2) + 'M';
    if (a >= 1e3) return '฿' + (v/1e3).toFixed(1) + 'K';
    return '฿' + v.toFixed(0);
  }
  if (opts.pct) return v.toFixed(opts.dp ?? 1) + '%';
  if (opts.dp !== undefined) return v.toFixed(opts.dp);
  if (a >= 1e6) return (v/1e6).toFixed(1) + 'M';
  if (a >= 1e3) return (v/1e3).toFixed(1) + 'K';
  return String(Math.round(v));
}
const isNA = (v) => v === null || v === undefined;

const CHANNEL_COLORS = ['#7C6BF5','#4B8DF8','#35C3B4','#F2A93B','#F2708F','#3BC97F','#9B8CEF','#6ECBE0','#E8A0C4','#A8B4D4'];
const colorFor = (i) => CHANNEL_COLORS[i % CHANNEL_COLORS.length];

function setStatus(kind, text) {
  $('statusDot').className = 'dot ' + (kind === 'ok' ? '' : kind);
  $('statusText').textContent = text;
}

// ============================================================ date controls
function setDays(days) {
  const to = new Date(), from = new Date();
  from.setDate(to.getDate() - (days - 1));
  $('from').value = fmtISO(from); $('to').value = fmtISO(to);
}
function setMTD() {
  const now = new Date();
  $('from').value = fmtISO(new Date(now.getFullYear(), now.getMonth(), 1));
  $('to').value = fmtISO(now);
}
function setLastMonth() {
  const now = new Date();
  $('from').value = fmtISO(new Date(now.getFullYear(), now.getMonth() - 1, 1));
  $('to').value = fmtISO(new Date(now.getFullYear(), now.getMonth(), 0));
}
$('presets').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('presets').children].forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  if (b.dataset.days) setDays(+b.dataset.days); else if (b.dataset.lastmonth) setLastMonth(); else setMTD();
});
['from','to'].forEach(id => $(id).addEventListener('change', () =>
  [...$('presets').children].forEach(b => b.classList.remove('active'))));
setLastMonth();

// ============================================================ navigation
// Client-side only: switching tabs never refetches, which was the whole point.
function goTo(view, { push = true } = {}) {
  if (!S.me || !S.me.tabs.includes(view)) return;
  S.view = view;
  document.querySelectorAll('.nav-item').forEach(i => i.classList.toggle('active', i.dataset.view === view));
  // Tabs are addressable, so a view can be bookmarked or sent to a colleague.
  if (push && location.hash.slice(1) !== view) location.hash = view;
}

window.addEventListener('hashchange', () => {
  const v = location.hash.slice(1);
  if (v && v !== S.view && S.me && S.me.tabs.includes(v)) { goTo(v, { push:false }); render(); }
});

document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    if (!S.me || !S.me.tabs.includes(item.dataset.view)) return;
    goTo(item.dataset.view);
    if (S.view === 'gbp' && !S.gbpInit) {
      // Reviews accumulate slowly, so a year is the useful default window.
      const y = new Date(); y.setDate(y.getDate() - 1);
      const start = new Date(y); start.setFullYear(start.getFullYear() - 1); start.setDate(start.getDate() + 1);
      $('from').value = fmtISO(start); $('to').value = fmtISO(y);
      [...$('presets').children].forEach(b => b.classList.remove('active'));
      S.gbpInit = true;
    }
    render();
  });
});

// Views where the toolbar date range has no meaning.
const NO_DATE_VIEWS = new Set(['benchmark', 'users']);

const TITLES = {
  overview: ['Overview', 'Impressions → Visits → Key Events across all channels'],
  campaigns: ['Campaigns', 'Enter a utm_campaign code to see its funnel and every variant'],
  topics: ['Topic Explorer', 'Multilingual search demand across 10 site languages'],
  users: ['Users', 'Who can see which tab'],
  audit: ['Tagging audit', 'How much traffic and spend the campaign view cannot attribute'],
  benchmark: ['Benchmarks', 'Latest complete month against trailing 3, 6 and 12-month norms'],
  gbp: ['Google Business Profile', 'Reviews and ratings by listing'],
  audiences: ['Audiences', 'Meta audience sets ranked by cost per first-degree result'],
  ecom: ['E-commerce', 'Package sales across every online sales channel'],
  ecomcentre: ['E-commerce · By centre', 'Which centres sell, through which channel, and how much is still unredeemed'],
};

// ============================================================ fetching
async function loadOverview(refresh = false) {
  const key = `${$('from').value}|${$('to').value}`;
  if (!refresh && S.overviewKey === key && S.overview) return S.overview;
  setStatus('busy', 'pulling GA4, Meta, Search Console, GMB, LINE…');
  const url = `/api/overview?from=${$('from').value}&to=${$('to').value}${refresh ? '&refresh=1' : ''}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Server ${res.status}: ${(await res.text()).slice(0,200)}`);
  S.overview = await res.json(); S.overviewKey = key;
  setStatus('ok', S.overview.cached ? `cached ${S.overview.cacheAgeSec}s ago` : `synced ${new Date().toLocaleTimeString()}`);
  return S.overview;
}

async function loadEcomCentres(refresh = false) {
  const key = `${$('from').value}|${$('to').value}|${S.ecomScope}`;
  if (!refresh && S.ecomcKey === key && S.ecomc) return S.ecomc;
  setStatus('busy', 'grouping sales by centre…');
  const res = await fetch(`/api/ecommerce/centres?from=${$('from').value}&to=${$('to').value}&scope=${S.ecomScope}${refresh?'&refresh=1':''}`);
  if (!res.ok) throw new Error(`Server ${res.status}: ${(await res.text()).slice(0,220)}`);
  S.ecomc = await res.json(); S.ecomcKey = key;
  setStatus('ok', S.ecomc.cached ? `cached ${S.ecomc.cacheAgeSec}s ago` : `synced ${new Date().toLocaleTimeString()}`);
  return S.ecomc;
}

async function loadEcom(refresh = false) {
  const key = `${$('from').value}|${$('to').value}|${S.ecomScope}`;
  if (!refresh && S.ecomKey === key && S.ecom) return S.ecom;
  setStatus('busy', 'reading the Orders sheet…');
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 120000);
  let res;
  try {
    res = await fetch(`/api/ecommerce?from=${$('from').value}&to=${$('to').value}&scope=${S.ecomScope}${refresh?'&refresh=1':''}`, { signal: ctrl.signal });
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'The Orders sheet took too long to read. Press Refresh to retry.' : `Network error: ${e.message}`);
  } finally { clearTimeout(timer); }
  if (!res.ok) throw new Error(`Server ${res.status}: ${(await res.text()).slice(0,220)}`);
  S.ecom = await res.json(); S.ecomKey = key;
  setStatus('ok', S.ecom.cached ? `cached ${S.ecom.cacheAgeSec}s ago` : `synced ${new Date().toLocaleTimeString()}`);
  return S.ecom;
}

async function loadAudiences(refresh = false) {
  const key = `${$('from').value}|${$('to').value}`;
  if (!refresh && S.audiencesKey === key && S.audiences) return S.audiences;
  setStatus('busy', 'pulling Meta ad sets…');
  // Without a timeout a stalled upstream leaves the view spinning with no way
  // out except a manual reload; 3 minutes is well past a normal pull.
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 180000);
  let res;
  try {
    res = await fetch(`/api/audiences?from=${$('from').value}&to=${$('to').value}${refresh?'&refresh=1':''}`, { signal: ctrl.signal });
  } catch (e) {
    throw new Error(e.name === 'AbortError'
      ? 'Meta took longer than 3 minutes to answer. Try a shorter date range, or press Refresh to retry.'
      : `Network error: ${e.message}`);
  } finally { clearTimeout(timer); }
  if (!res.ok) throw new Error(`Server ${res.status}: ${(await res.text()).slice(0,200)}`);
  S.audiences = await res.json(); S.audiencesKey = key;
  setStatus('ok', S.audiences.cached ? `cached ${S.audiences.cacheAgeSec}s ago` : `synced ${new Date().toLocaleTimeString()}`);
  return S.audiences;
}

async function loadCampaign(code, refresh = false) {
  setStatus('busy', `matching “${code}”…`);
  const url = `/api/campaign?code=${encodeURIComponent(code)}&from=${$('from').value}&to=${$('to').value}${refresh?'&refresh=1':''}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Server ${res.status}: ${(await res.text()).slice(0,200)}`);
  S.campaign = await res.json(); S.campaignCode = code;
  setStatus('ok', S.campaign.cached ? `cached ${S.campaign.cacheAgeSec}s ago` : `synced ${new Date().toLocaleTimeString()}`);
  return S.campaign;
}

async function loadCampaignList() {
  const key = `${$('from').value}|${$('to').value}`;
  if (S.campaignListKey === key && S.campaignList) return S.campaignList;
  const res = await fetch(`/api/campaigns?from=${$('from').value}&to=${$('to').value}`);
  if (!res.ok) throw new Error(`Server ${res.status}`);
  S.campaignList = await res.json(); S.campaignListKey = key;
  return S.campaignList;
}

async function loadGbp(refresh = false) {
  const key = `${$('from').value}|${$('to').value}`;
  if (!refresh && S.gbpKey === key && S.gbp) return S.gbp;
  setStatus('busy', 'pulling reviews for all listings…');
  const res = await fetch(`/api/gbp?from=${$('from').value}&to=${$('to').value}${refresh?'&refresh=1':''}`);
  if (!res.ok) throw new Error(`Server ${res.status}: ${(await res.text()).slice(0,200)}`);
  S.gbp = await res.json(); S.gbpKey = key;
  setStatus('ok', S.gbp.cached ? `cached ${S.gbp.cacheAgeSec}s ago` : `synced ${new Date().toLocaleTimeString()}`);
  return S.gbp;
}

async function loadBenchmark(refresh = false) {
  const key = $('to').value;
  if (!refresh && S.benchKey === key && S.bench) return S.bench;
  setStatus('busy', 'building 12-month benchmark…');
  const res = await fetch(`/api/benchmark?to=${$('to').value}${refresh?'&refresh=1':''}`);
  if (!res.ok) throw new Error(`Server ${res.status}: ${(await res.text()).slice(0,200)}`);
  S.bench = await res.json(); S.benchKey = key;
  setStatus('ok', S.bench.cached ? `cached ${S.bench.cacheAgeSec}s ago` : `synced ${new Date().toLocaleTimeString()}`);
  return S.bench;
}

async function loadAudit(refresh = false) {
  const key = `${$('from').value}|${$('to').value}`;
  if (!refresh && S.auditKey === key && S.audit) return S.audit;
  setStatus('busy', 'auditing campaign tagging…');
  const res = await fetch(`/api/untagged?from=${$('from').value}&to=${$('to').value}${refresh?'&refresh=1':''}`);
  if (!res.ok) throw new Error(`Server ${res.status}: ${(await res.text()).slice(0,200)}`);
  S.audit = await res.json(); S.auditKey = key;
  setStatus('ok', S.audit.cached ? `cached ${S.audit.cacheAgeSec}s ago` : `synced ${new Date().toLocaleTimeString()}`);
  return S.audit;
}

async function loadTopic(topic) {
  setStatus('busy', `expanding “${topic}” across 10 languages…`);
  const res = await fetch('/api/topic', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ topic, from: $('from').value, to: $('to').value }),
  });
  if (!res.ok) throw new Error(`Server ${res.status}: ${(await res.text()).slice(0,220)}`);
  S.topic = await res.json(); S.topicTerm = topic;
  setStatus('ok', S.topic.cached ? `cached ${S.topic.cacheAgeSec}s ago` : `synced ${new Date().toLocaleTimeString()}`);
  return S.topic;
}

$('loadBtn').addEventListener('click', async () => {
  const btn = $('loadBtn');
  btn.disabled = true; btn.classList.add('loading'); $('loadLabel').textContent = 'Loading…';
  try {
    if (S.view === 'overview') { await loadOverview(true); }
    else if (S.view === 'campaigns') {
      S.campaignList = null; S.campaignListKey = null;
      if (S.campaignCode) await loadCampaign(S.campaignCode, true);
    }
    else if (S.view === 'audit') { await loadAudit(true); }
    else if (S.view === 'benchmark') { await loadBenchmark(true); }
    else if (S.view === 'gbp') { await loadGbp(true); }
    else if (S.view === 'audiences') { S.audiencesError = null; await loadAudiences(true); }
    else if (S.view === 'ecom') { S.ecomError = null; await loadEcom(true); }
    else if (S.view === 'ecomcentre') { S.ecomcError = null; await loadEcomCentres(true); }
    else if (S.view === 'users') { S.users = null; await loadUsers(); }
    else if (S.view === 'topics' && S.topicTerm) { await loadTopic(S.topicTerm); }
    render();
  } catch (err) {
    setStatus('bad', 'failed');
    $('viewRoot').innerHTML = errorState(err.message);
  } finally {
    btn.disabled = false; btn.classList.remove('loading'); $('loadLabel').textContent = 'Refresh';
  }
});

const errorState = (msg) => `<div class="card"><div class="state bad"><div class="big">Something went wrong</div>
  <div style="max-width:460px;font-size:12.5px;">${esc(msg)}</div></div></div>`;
const loadingState = (msg) => `<div class="card"><div class="state"><div class="big">${esc(msg)}</div>
  <div style="font-size:12px;">Live pull — a few seconds.</div></div></div>`;

// ============================================================ render: shell
function render() {
  const [t, s] = TITLES[S.view];
  $('viewTitle').textContent = t; $('viewSub').textContent = s;
  // The benchmark is inherently trailing, so a range picker would only mislead.
  const hideDates = NO_DATE_VIEWS.has(S.view);
  document.querySelector('.dates').classList.toggle('hidden', hideDates);
  $('presets').classList.toggle('hidden', hideDates);
  // On Campaigns the Analyse button already fetches with the current dates,
  // so a second fetch button would just be a confusing twin.
  $('loadBtn').classList.toggle('hidden', S.view === 'campaigns');
  Object.values(S.charts).forEach(c => { try { c.destroy(); } catch(_){} });
  S.charts = {};
  if (S.view === 'overview') renderOverview();
  else if (S.view === 'campaigns') renderCampaigns();
  else if (S.view === 'audit') renderAudit();
  else if (S.view === 'benchmark') renderBenchmark();
  else if (S.view === 'gbp') renderGbp();
  else if (S.view === 'audiences') renderAudiences();
  else if (S.view === 'ecom') renderEcom();
  else if (S.view === 'ecomcentre') renderEcomCentres();
  else if (S.view === 'users') renderUsers();
  else renderTopics();
}

// ============================================================ OVERVIEW
function renderOverview() {
  const d = S.overview;
  if (!d) {
    $('viewRoot').innerHTML = `<div class="card"><div class="state">
      <div class="big">Ready to pull</div>
      <div style="max-width:400px;font-size:12.5px;">Pick a range and press <b>Load</b>. Sources: GA4 (Group), Meta Ads, Search Console, Google Business Profile, FB &amp; TikTok organic, LINE.</div>
    </div></div>`;
    return;
  }

  const f = d.funnel || [];
  const totalVisits = f.reduce((a,c)=>a+c.visits,0) || 1;
  const impChannels = f.filter(c => !isNA(c.impressions));
  const totalImp = impChannels.reduce((a,c)=>a+c.impressions,0) || 1;
  const totalKE = f.reduce((a,c)=>a+c.keyEvents,0) || 1;
  const totalEng = f.reduce((a,c)=>a+c.engagement,0) || 1;
  const clickChannels = f.filter(c => !isNA(c.clicks));
  const totalClicks = clickChannels.reduce((a,c)=>a+c.clicks,0) || 1;

  const seg = (chans, total, key) => chans.map((c,i) => {
    const v = c[key];
    const pct = (v/total)*100;
    if (pct <= 0) return '';
    // Value shown inside the segment when it's wide enough to hold it;
    // narrow slivers keep the hover title only, so labels never overlap.
    const label = pct >= 9 ? `<b class="seg-val">${num(v)}</b>` : '';
    return `<span style="width:${pct}%;background:${colorFor(f.indexOf(c))}" title="${esc(c.channel)}: ${num(v)}">${label}</span>`;
  }).join('');

  const unavail = (d.unavailable||[]).length
    ? `<div class="warnbox"><b>Unavailable this run:</b> ${d.unavailable.map(esc).join(', ')}. These show as “—”, not zero — the numbers below exclude them.</div>` : '';

  const ec = d.ecommerce, fc = d.forecast;

  $('viewRoot').innerHTML = `
    ${unavail}

    <!-- funnel -->
    <div class="card">
      <h2>Funnel &middot; stacked by channel</h2>
      <div class="stage">
        <div class="stage-head"><span class="stage-name">Impressions</span>
          <span class="stage-val ${isNA(d.totals.impressions)?'na':''}">${num(d.totals.impressions)}</span></div>
        <div class="bar">${seg(impChannels, totalImp, 'impressions')}</div>
        <div class="stage-note">Meta Ads + Search Console + organic social. Units differ per platform, so read this as scale rather than one audited total. GMB and LINE reach are listed separately below.</div>
      </div>

      <div class="stage">
        <div class="stage-head"><span class="stage-name">Visits</span>

        <div class="stage-head"><span class="stage-name">Engagement</span>

        <div class="bar">${seg(f, totalEng, 'engagement')}</div>

      <div class="stage">
        <div class="stage-head"><span class="stage-name">Key Events</span>

        ${f.map((c,i)=>`<tr>
          <td class="strong"><span class="chip" style="background:${colorFor(i)};margin-right:7px;"></span>${esc(c.channel)}</td>

          <td class="num">${num(c.clicks)}</td>
          <td class="num">${num(c.visits)}</td>
          <td class="num">${num(c.engagement)}</td>
          <td class="num">${num(c.keyEvents)}</td>
          <td class="num">${c.visits?num((c.keyEvents/c.visits)*100,{pct:true}):'—'}</td>

      </div>
      <div class="card">
        <h2>Reach without site visits</h2>
        <table><tbody>
        ${(d.reachOnly||[]).map(r=>`<tr><td class="strong">${esc(r.channel)}<div style="font-size:10.5px;color:var(--faint)">${esc(r.note)}${r.sub?' · '+esc(r.sub):''}</div></td>
          <td class="num" style="font-size:15px;font-weight:600;color:${isNA(r.impressions)?'var(--faint)':'var(--ink)'}">${num(r.impressions)}</td></tr>`).join('')}
        </tbody></table>
        <div class="note">These platforms drive awareness and offline action (calls, directions) GA4 can't attribute as sessions, so they sit outside the funnel. LINE counts <b>messages sent</b>, which exceeds follower count because each follower receives several messages in a period &mdash; it is not unique people reached.</div>
      </div>
    </div>

    <!-- paid media -->
    <div class="card mt">
      <h2>Paid media</h2>
      <div class="grid g-4">
        <div class="stat"><div class="lab"><span class="chip" style="background:var(--amber)"></span>Ad spend</div>

        <div class="stat"><div class="lab"><span class="chip" style="background:var(--blue)"></span>Ad impressions</div>

          <div class="val ${isNA(d.paid&&d.paid.cpc)?'na':''}">${num(d.paid&&d.paid.cpc,{money:true})}</div></div>
      </div>
    </div>

    <!-- ecommerce -->
    <div class="card mt">
      <h2>E-commerce</h2>
      <div class="grid g-5">
        <div class="stat"><div class="lab"><span class="chip" style="background:var(--blue)"></span>Product views</div>
          <div class="val ${isNA(ec&&ec.productViews)?'na':''}">${num(ec&&ec.productViews)}</div></div>
        <div class="stat"><div class="lab"><span class="chip" style="background:var(--teal)"></span>Add to cart</div>
          <div class="val ${isNA(ec&&ec.addToCarts)?'na':''}">${num(ec&&ec.addToCarts)}</div>
          <div class="sub">${ec&&ec.cartRate!=null?num(ec.cartRate,{pct:true})+' of views':''}</div></div>
        <div class="stat"><div class="lab"><span class="chip" style="background:var(--green)"></span>Purchases</div>
          <div class="val ${isNA(ec&&ec.purchases)?'na':''}">${num(ec&&ec.purchases)}</div>
          <div class="sub">${ec&&ec.purchaseRate!=null?num(ec.purchaseRate,{pct:true})+' of views':''}</div></div>
        <div class="stat"><div class="lab"><span class="chip" style="background:var(--amber)"></span>Revenue</div>
          <div class="val ${isNA(ec&&ec.revenue)?'na':''}">${num(ec&&ec.revenue,{money:true})}</div>
          <div class="sub">${ec&&ec.aov!=null?'AOV '+num(ec.aov,{money:true}):''}</div></div>
        <div class="stat"><div class="lab"><span class="chip" style="background:var(--violet)"></span>Month-end forecast</div>

      </div>
      <div class="note">Forecast is a straight run-rate (MTD daily average × days in month) — it assumes the rest of the month behaves like the days so far, so it will mislead around campaign bursts or paydays. Revenue is GA4 web only; Shopee and Lazada sales are not included.</div>
    </div>

    <!-- trend + key events -->
    <div class="grid g-2-1 mt">
      <div class="card"><h2>Trend</h2><div class="chart-wrap"><canvas id="trendChart"></canvas></div></div>
      <div class="card"><h2>Key events</h2>
        <table><tbody>${(d.keyEventBreakdown||[]).map(k=>`<tr><td class="strong">${esc(k.label)}</td><td class="num">${num(k.value)}</td></tr>`).join('')||'<tr><td class="num">—</td></tr>'}</tbody></table>
      </div>
    </div>

    <!-- paid + products -->
    <div class="grid g-2-1 mt">
      <div class="card">
        <h2>Meta Ads by account</h2>
        <table><thead><tr><th>Account</th><th class="num">Spend</th><th class="num">Impressions</th><th class="num">Clicks</th></tr></thead><tbody>
        ${(d.topAccounts||[]).map(a=>`<tr><td class="strong">${esc(a.name)}</td><td class="num">${num(a.spend,{money:true})}</td><td class="num">${num(a.impressions)}</td><td class="num">${num(a.clicks)}</td></tr>`).join('')||'<tr><td colspan="4" class="num">unavailable</td></tr>'}

      </div>
      <div class="card">
        <h2>Top products</h2>

        ${(d.topProducts||[]).slice(0,8).map(p=>`<tr><td class="strong i18n">${esc(p.name)}</td><td class="num">${num(p.revenue,{money:true})}</td></tr>`).join('')||'<tr><td colspan="2" class="num">no item data</td></tr>'}
        </tbody></table>
      </div>
    </div>
  `;

  drawChart('trendChart', d.trend||[], [
    { label:'Visits', key:'visits', color:'#4B8DF8', axis:'y' },
    { label:'Engaged sessions', key:'engagement', color:'#9FC8C2', axis:'y' },
    { label:'Key events', key:'keyEvents', color:'#7C6BF5', axis:'y1' },
    { label:'Spend', key:'spend', color:'#F2A93B', axis:'y1' },
  ]);
}

// ============================================================ CAMPAIGNS
function renderCampaigns() {
  const d = S.campaign;
  $('viewRoot').innerHTML = `
    <div class="search">
      <input class="text" id="campInput" placeholder="utm_campaign code — e.g. 260501 or 260601-03_bgh" value="${esc(S.campaignCode)}" autocomplete="off">
      <button class="btn btn-primary" id="campGo"><span class="spin"></span><span>Analyse</span></button>
      <button class="btn btn-ghost" id="campBrowse">Browse codes</button>
    </div>
    <p class="hint">Prefix match, case-insensitive. Type <b>260501</b> to roll up every <b>260501-*</b> variant, or a fuller code to narrow it. Visits and key events come from GA4; impressions are matched from Meta Ads campaign names.</p>
    <div id="campBody">${d ? '' : `<div class="card"><div class="state"><div class="big">No campaign loaded</div>
      <div style="max-width:420px;font-size:12.5px;">Enter a code above, or press <b>Browse codes</b> to see what ran in this date range.</div></div></div>`}</div>
  `;
  if (d) renderCampaignBody(d);

  $('campGo').addEventListener('click', runCampaign);
  $('campInput').addEventListener('keydown', e => { if (e.key === 'Enter') runCampaign(); });
  $('campBrowse').addEventListener('click', browseCampaigns);
}

async function runCampaign() {
  const code = $('campInput').value.trim();
  if (code.length < 2) { $('campInput').focus(); return; }
  const btn = $('campGo'); btn.disabled = true; btn.classList.add('loading');
  $('campBody').innerHTML = loadingState(`Matching “${code}”…`);
  try { renderCampaignBody(await loadCampaign(code)); }
  catch (err) { setStatus('bad','failed'); $('campBody').innerHTML = errorState(err.message); }
  finally { btn.disabled = false; btn.classList.remove('loading'); }
}

async function browseCampaigns() {
  $('campBody').innerHTML = loadingState('Listing campaign codes…');
  try {
    const l = await loadCampaignList();
    const rows = (l.campaigns||[]).slice(0,60).map(c => `<tr>
      <td class="strong i18n" style="cursor:pointer" data-code="${esc(c.code)}">
        ${c.topic?`${esc(c.topic)}<div style="font-size:10.5px;color:var(--faint);font-weight:400;">${esc(c.code)}</div>`:esc(c.code)}
        ${c.untagged?'<span class="pill warn" style="margin-left:7px;">untagged</span>':''}</td>
      <td class="num">${num(c.visits)}</td></tr>`).join('');
    $('campBody').innerHTML = `<div class="card">
      <h2>Campaign codes in range · ${l.total} total</h2>
      ${l.untaggedCount ? `<div class="warnbox"><b>${l.untaggedCount} codes look untagged.</b> They are bare numeric platform IDs, which means those ads reached GA4 without a proper utm_campaign — so they can't be grouped with their campaign. Worth fixing at the tagging step.</div>` : ''}
      <table><thead><tr><th>Campaign (click to analyse)</th><th class="num">Visits</th></tr></thead><tbody>${rows||'<tr><td colspan="2" class="num">none</td></tr>'}</tbody></table>
    </div>`;
    $('campBody').querySelectorAll('td[data-code]').forEach(td => td.addEventListener('click', () => {
      $('campInput').value = td.dataset.code; runCampaign();
    }));
  } catch (err) { $('campBody').innerHTML = errorState(err.message); }
}

function renderCampaignBody(d) {
  const t = d.totals;

  // Nothing matched: an explanation beats a funnel full of zeros.
  if (d.emptyResult) {
    const hint = d.dateHint;
    $('campBody').innerHTML = `<div class="card"><div class="state">
      <div class="big">No data for &ldquo;${esc(d.code)}&rdquo; in this date range</div>
      ${hint ? `<div class="warnbox" style="max-width:560px;margin-top:6px;text-align:left;">
          <b>Likely the date range.</b> ${esc(hint.message)}
        </div>
        <button class="btn btn-primary" id="fixRange" data-launch="${esc(hint.launch)}">Widen range to include ${esc(hint.launch)}</button>`
        : `<div style="max-width:480px;font-size:12.5px;">No GA4 traffic and no ad campaigns carry this prefix between ${esc(d.range.from)} and ${esc(d.range.to)}. Check the spelling, try a shorter prefix, or browse the codes that did run.</div>`}
      <button class="btn btn-ghost" id="emptyBrowse" style="margin-top:4px;">Browse codes that ran in this range</button>
    </div></div>`;
    const fix = document.getElementById('fixRange');
    if (fix) fix.addEventListener('click', () => {
      // Start a fortnight before launch, run to today — enough to catch the flight.
      const l = new Date(fix.dataset.launch);
      l.setDate(l.getDate() - 14);
      $('from').value = fmtISO(l);
      $('to').value = fmtISO(new Date());
      [...$('presets').children].forEach(b => b.classList.remove('active'));
      runCampaign();
    });
    const eb = document.getElementById('emptyBrowse');
    if (eb) eb.addEventListener('click', browseCampaigns);
    return;
  }
  const impPct = t.impressions ? 100 : 0;
  // Without an impressions baseline, scale the lower stages against visits.
  const visitPct = !t.visits ? 0 : (t.impressions ? Math.max((t.visits/t.impressions)*100, 0.6) : 100);
  const kePct = !t.keyEvents ? 0 : (t.impressions ? Math.max((t.keyEvents/t.impressions)*100, 0.4)
                              : (t.visits ? Math.max((t.keyEvents/t.visits)*100,0.4) : 0));
  const clickPct = !t.clicks ? 0 : (t.impressions ? Math.max((t.clicks/t.impressions)*100, 0.5) : 100);
  const engPct = !t.engagement ? 0 : Math.min(100, t.impressions ? Math.max((t.engagement/t.impressions)*100, 0.4)
                               : (t.visits ? Math.max((t.engagement/t.visits)*100,0.4) : 0));

  $('campBody').innerHTML = `
    ${d.notes ? `<div class="warnbox">${d.offSiteGoal?'<b>This campaign doesn\'t send traffic to the website.</b> ':''}${esc(d.notes)}</div>` : ''}
    <div class="grid g-3">
      <div class="stat card"><div class="lab"><span class="chip" style="background:var(--amber)"></span>Ad spend</div>
        <div class="val ${isNA(t.spend)?'na':''}">${num(t.spend,{money:true})}</div>
        <div class="sub">${d.unattributedSpend?num(d.unattributedSpend,{money:true})+' not tied to a utm variant':'across matched ad campaigns'}</div></div>
      ${d.offSiteGoal?`
      <div class="stat card"><div class="lab">${esc(d.goalResultLabel||'result')}s <span class="pill">${esc(d.goalLabel||'')}</span></div>
        <div class="val">${num(d.goalResults)}</div>
        <div class="sub">counted by Meta, not the website</div></div>
      <div class="stat card"><div class="lab">Cost per ${esc(d.goalResultLabel||'result')}</div>
        <div class="val ${isNA(d.goalCostPerResult)?'na':''}">${num(d.goalCostPerResult,{money:true})}</div>
        <div class="sub">${d.goalResults?num(t.spend,{money:true})+' ÷ '+num(d.goalResults):''}</div></div>
      `:`
      <div class="stat card"><div class="lab">Cost per visit</div>
        <div class="val ${isNA(t.costPerVisit)?'na':''}">${num(t.costPerVisit,{money:true})}</div>
        <div class="sub">${t.spend!=null&&t.visits?num(t.spend,{money:true})+' ÷ '+num(t.visits)+' visits':''}</div></div>
      <div class="stat card"><div class="lab">Cost per contact</div>
        <div class="val ${isNA(t.costPerContact)?'na':''}">${num(t.costPerContact,{money:true})}</div>
        <div class="sub">${t.contacts?num(t.contacts)+' contact-us events':'no contact events'}</div></div>
      `}
    </div>
    <div class="grid g-5 mt">

      <div class="stat card"><div class="lab">Impressions</div><div class="val ${isNA(t.impressions)?'na':''}">${num(t.impressions)}</div>

          <div class="stat"><div class="lab">Delivered</div><div class="val">${num(d.lineMessages.delivered)}</div></div>
          <div class="stat"><div class="lab">Opened</div><div class="val">${num(d.lineMessages.opens)}</div></div>
          <div class="stat"><div class="lab">Link clicks</div><div class="val">${num(d.lineMessages.clicks)}</div></div>
        </div></div>`:''}
      ${(d.shortLinks||[]).length?`<div class="note"><b>Registered short links:</b> ${d.shortLinks.slice(0,8).map(l=>`<code style="font-size:11px;">${esc(l)}</code>`).join(' &middot; ')}${d.shortLinks.length>8?` +${d.shortLinks.length-8} more`:''}<br>Organic posts are found by searching post text for these links, so a post only appears here if it used a link registered in UTM Builder 2026. LINE broadcasts and EDM can't be matched this way &mdash; those platforms don't expose message content.</div>`:'<div class="note">No short links are registered against this code in UTM Builder 2026, so organic posts can\'t be matched.</div>'}
    </div>`:''}

    ${(d.sheetErrors&&d.sheetErrors.length)?`<div class="warnbox">Internal sheets unavailable: ${d.sheetErrors.map(esc).join(' | ')} &mdash; campaign names and organic matching are degraded. Check <code>/api/sheets-check</code>.</div>`:''}

    ${t.impressions?`<div class="card mt">
      <h2>Ad platform performance${d.objectives&&d.objectives.length?` <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--faint);">· objective: ${d.objectives.map(esc).join(', ')}</span>`:''}</h2>

      <div class="grid g-4">
        <div class="stat"><div class="lab">Link CTR</div><div class="val">${num(t.ctr,{pct:true,dp:2})}</div>
          <div class="sub">${num(t.linkClicks)} link clicks ÷ ${num(t.impressions)} impr</div></div>
        <div class="stat"><div class="lab">Cost per link click</div><div class="val">${num(t.cpc,{money:true})}</div>
          <div class="sub">CPM ${num(t.cpm,{money:true})}</div></div>
        <div class="stat"><div class="lab">Landing page views</div><div class="val ${isNA(t.landingPageViews)?'na':''}">${num(t.landingPageViews)}</div>
          <div class="sub">${t.costPerLpv!=null?num(t.costPerLpv,{money:true})+' each':'reported by Meta'}</div></div>
        <div class="stat"><div class="lab">Page view → session</div>
          <div class="val" style="${t.lpvToVisit!=null&&t.lpvToVisit<50?'color:var(--rose)':''}">${t.lpvToVisit!=null?num(t.lpvToVisit,{pct:true,dp:1}):'—'}</div>
          <div class="sub">${num(t.visits)} sessions from ${num(t.landingPageViews)} page views</div></div>
      </div>

      <div class="grid g-4 mt">
        <div class="stat"><div class="lab">Clicks (all)</div><div class="val" style="color:var(--muted)">${num(t.clicks)}</div>
          <div class="sub">incl. reactions &amp; expands · ${num(t.ctrAll,{pct:true,dp:2})} of impr</div></div>
        <div class="stat"><div class="lab">Leads</div>
          <div class="val ${!t.leads?'na':''}">${t.leads?num(t.leads):'0'}</div>
          <div class="sub">${t.costPerLead!=null?num(t.costPerLead,{money:true})+' per lead':'no lead-objective campaign here'}</div></div>
        <div class="stat"><div class="lab">Conversations</div>
          <div class="val ${!t.messages?'na':''}">${t.messages?num(t.messages):'0'}</div>
          <div class="sub">${t.costPerMessage!=null?num(t.costPerMessage,{money:true})+' each':'none started'}</div></div>
        <div class="stat"><div class="lab">Sessions not recorded</div>
          <div class="val" style="${t.lostSessions?'color:var(--rose)':''}">${t.lostSessions!=null?num(t.lostSessions):'—'}</div>
          <div class="sub">page views with no tagged session</div></div>
      </div>

      ${t.lpvToVisit!=null&&t.lpvToVisit<50?`<div class="warnbox" style="margin-top:14px;">
        <b>Tagging gap, quantified.</b> Meta recorded ${num(t.landingPageViews)} landing page views &mdash; browsers that actually rendered your page &mdash; but only ${num(t.visits)} sessions carry this campaign code. Around ${num(t.lostSessions)} visits arrived and were credited elsewhere, so ${num(t.spend,{money:true})} of spend can't be tied to any outcome. The destination URL is missing its <code>utm_campaign</code>, or carries a different one.
      </div>`:''}

      <div class="note"><b>Link CTR and cost per link click use link clicks, not Meta's "clicks (all)"</b>, which also counts reactions, photo expands and profile taps and so overstates traffic intent &mdash; often by half. <b>Page view → session</b> is the tagging health check and the only fair comparison available: Meta's landing page view means the browser rendered your page, so it should closely match a GA4 session. A large shortfall is a measurement failure, not lost interest. Leads and conversations show as 0 rather than being hidden, so you can see the objective produced none.</div>
    </div>`:''}

    <div class="card mt">
      <h2>Campaign detail</h2>
      <table>
        <thead><tr>
          <th>Campaign</th><th>Source</th>
          <th class="num">Impr</th><th class="num">Clicks</th><th class="num">Spend</th>
          <th class="num">Visits</th><th class="num">Engaged</th><th class="num">Key ev.</th>
          <th class="num">฿/visit</th><th class="num">฿/contact</th><th class="num">Revenue</th>
        </tr></thead>
        <tbody>
          ${(d.variants||[]).map(v=>`<tr>
            <td class="strong i18n trunc" title="${esc(v.code)}${v.adNames&&v.adNames.length?' \u2014 ad campaigns: '+esc(v.adNames.join(' | ')):''}">${esc(v.code)}</td>
            <td>${esc(v.source||'—')}${v.medium?' <span style="color:var(--faint)">/ '+esc(v.medium)+'</span>':''}</td>
            <td class="num">${num(v.impressions)}${v.organicSource?' <span class="pill grey" title="From organic Facebook posts matched by short link — not ad-platform data">org</span>':''}${v.lineSent?' <span class="pill grey" title="LINE messages delivered on the campaign date — delivery volume, not views. LINE never reports views or clicks for OA Manager sends.">sent</span>':''}</td>
            <td class="num">${num(v.clicks)}${v.organicSource?' <span class="pill grey" title="From organic Facebook posts matched by short link — not ad-platform data">org</span>':''}</td>
            <td class="num">${num(v.spend,{money:true})}${v.spendEstimated?' <span class="pill grey" title="Split across variants by visit share">~</span>':''}</td>
            <td class="num">${num(v.visits)}</td>
            <td class="num">${num(v.engagement)}</td>
            <td class="num">${num(v.keyEvents)}</td>
            <td class="num">${num(v.costPerVisit,{money:true})}</td>
            <td class="num">${num(v.costPerContact,{money:true})}</td>
            <td class="num">${num(v.revenue,{money:true})}</td>
          </tr>`).join('')||((d.orphanAdCampaigns||[]).length?'':'<tr><td colspan="11" class="num">no traffic matched this code</td></tr>')}

          ${(d.orphanAdCampaigns||[]).map(c=>`<tr>
            <td class="strong i18n trunc" title="${esc(c.name)}">${esc(c.name)}</td>
            <td><span class="pill warn">${esc(c.platform)} · no GA4 match</span></td>
            <td class="num">${num(c.impressions)}</td><td class="num">${num(c.clicks)}</td>
            <td class="num">${num(c.spend,{money:true})}</td>
            <td class="num dim">—</td><td class="num dim">—</td><td class="num dim">—</td>
            <td class="num dim">—</td><td class="num dim">—</td><td class="num dim">—</td>
          </tr>`).join('')}

          <tr class="tot">
            <td class="strong">Total</td><td></td>
            <td class="num">${num(t.impressions)}</td><td class="num">${num(t.clicks)}</td>
            <td class="num">${num(t.spend,{money:true})}</td>
            <td class="num">${num(t.visits)}</td><td class="num">${num(t.engagement)}</td>
            <td class="num">${num(t.keyEvents)}</td>
            <td class="num">${num(t.costPerVisit,{money:true})}</td>
            <td class="num">${num(t.costPerContact,{money:true})}</td>
            <td class="num">${num(t.revenue,{money:true})}</td>
          </tr>
        </tbody>
      </table>
      <div class="note">One row per utm_campaign + source. Ad impressions, clicks and spend are folded onto the matching paid row via utm_source, so organic rows are blank rather than zero; a <span class="pill grey">~</span> means spend was split across variants by visit share. Hover a campaign name for the full string and its underlying ad campaign names. A row marked <b>no GA4 match</b> is ad spend with no matching tagged traffic &mdash; usually a tagging gap worth fixing.${d.notConnected&&d.notConnected.length?` Not authorised in Windsor: ${d.notConnected.map(esc).join(', ')}.`:''}</div>
    </div>

    ${(d.trend||[]).length?`<div class="card mt no-print"><h2>Daily</h2><div class="chart-wrap"><canvas id="campChart"></canvas></div></div>`
      :`<div class="card mt no-print"><h2>Daily</h2><div class="state" style="padding:34px 20px;">
        <div class="big">No daily website activity</div>
        <div style="max-width:420px;font-size:12.5px;">${d.offSiteGoal?'Expected for this campaign type — the results happen on Meta, so there is no day-by-day site traffic to plot.':'No sessions carry this campaign code, so there is nothing to chart.'}</div>
      </div></div>`}
  `;
  drawFunnelChart('funnelChart', [
    { label:'Impressions', value:t.impressions, color:'#7C6BF5' },
    { label:'Clicks',      value:t.clicks,      color:'#A9B4CE' },
    { label:'Visits',      value:t.visits,      color:'#4B8DF8' },
    { label:'Engaged',     value:t.engagement,  color:'#9FC8C2' },
    { label:'Key events',  value:t.keyEvents,   color:'#3BC97F' },
  ]);
  if ((d.trend||[]).length) drawChart('campChart', d.trend, [
    { label:'Visits', key:'visits', color:'#4B8DF8', axis:'y' },
    { label:'Key events', key:'keyEvents', color:'#7C6BF5', axis:'y1' },
  ]);
}

// ============================================================ TOPICS
function renderTopics() {
  const d = S.topic;
  $('viewRoot').innerHTML = `
    <div class="search">
      <input class="text i18n" id="topicInput" placeholder="Clinical topic — e.g. gallbladder" value="${esc(S.topicTerm)}" autocomplete="off">
      <button class="btn btn-primary" id="topicGo"><span class="spin"></span><span>Explore</span></button>
    </div>
    <p class="hint">Claude expands the topic across Thai, English, Chinese, Japanese, Arabic, German, Burmese, Vietnamese, Khmer &amp; Indonesian, then matches it against what the site actually ranks for. Language is read from the ranking page's URL locale, not guessed from the script.</p>
    <div class="tags">${['gallbladder','heart disease','cancer screening','knee replacement','diabetes'].map(t=>`<button class="tag" data-t="${t}">${t}</button>`).join('')}</div>
    <div id="topicBody">${d?'':`<div class="card"><div class="state"><div class="big">No topic explored yet</div>
      <div style="max-width:420px;font-size:12.5px;">Enter a clinical topic to see multilingual search demand and content gaps.</div></div></div>`}</div>
  `;
  if (d) renderTopicBody(d);
  $('topicGo').addEventListener('click', runTopic);
  $('topicInput').addEventListener('keydown', e => { if (e.key==='Enter') runTopic(); });
  document.querySelectorAll('.tag').forEach(b => b.addEventListener('click', () => {
    $('topicInput').value = b.dataset.t; runTopic();
  }));
}

async function runTopic() {
  const topic = $('topicInput').value.trim();
  if (!topic) { $('topicInput').focus(); return; }
  const btn = $('topicGo'); btn.disabled = true; btn.classList.add('loading');
  $('topicBody').innerHTML = loadingState(`Exploring “${topic}” across 10 languages…`);
  try { renderTopicBody(await loadTopic(topic)); }
  catch (err) { setStatus('bad','failed'); $('topicBody').innerHTML = errorState(err.message); }
  finally { btn.disabled = false; btn.classList.remove('loading'); }
}

function renderTopicBody(d) {
  const s = d.summary || {};
  $('topicBody').innerHTML = `
    <div class="grid g-5">
      <div class="stat card"><div class="lab">Matched queries</div><div class="val">${num(s.matchedQueries)}</div></div>
      <div class="stat card"><div class="lab">Clicks</div><div class="val">${num(s.totalClicks)}</div></div>
      <div class="stat card"><div class="lab">Impressions</div><div class="val">${num(s.totalImpressions)}</div></div>
      <div class="stat card"><div class="lab">Languages</div><div class="val">${num(s.languages)}</div></div>
      <div class="stat card"><div class="lab">Terms generated</div><div class="val">${num(s.termsGenerated)}</div></div>
    </div>

    <div class="card mt"><h2>Sub-topics</h2>
      ${(d.clusters||[]).map(c=>`<div class="cluster"><h3>${esc(c.label)}</h3>${(c.queries||[]).map(q=>`<span class="qtag i18n">${esc(q)}</span>`).join('')}</div>`).join('')
        || '<div style="color:var(--faint);font-size:12.5px;">No sub-topic grouping this run.</div>'}
      ${d.clusterNote?`<div class="note">${esc(d.clusterNote)}</div>`:''}
    </div>

    <div class="grid g-2-1 mt">
      <div class="card"><h2>By language</h2>
        <table><thead><tr><th>Language</th><th class="num">Queries</th><th class="num">Clicks</th><th class="num">Impr</th></tr></thead><tbody>
        ${(d.byLanguage||[]).map(l=>`<tr><td class="strong">${esc(l.name)} <span class="pill grey">${esc((l.lang||'').toUpperCase())}</span></td>
          <td class="num">${num(l.queries)}</td><td class="num">${num(l.clicks)}</td><td class="num">${num(l.impressions)}</td></tr>`).join('')||'<tr><td colspan="4" class="num">—</td></tr>'}
        </tbody></table>
      </div>
      <div class="card"><h2>Top countries</h2>
        <table><tbody>${(d.byCountry||[]).slice(0,10).map(c=>`<tr><td class="strong">${esc(c.country)}</td><td class="num">${num(c.clicks)}</td></tr>`).join('')||'<tr><td class="num">—</td></tr>'}</tbody></table>
      </div>
    </div>

    ${(d.gaps||[]).length?`<div class="card mt"><h2>Opportunity gaps</h2>
      ${d.gaps.slice(0,80).map(g=>`<span class="gap-tag i18n">${esc(g.term)} <span style="opacity:.6">${esc((g.lang||'').toUpperCase())}</span></span>`).join('')}
      <div class="note">Terms with no captured ranking. Search Console hides queries below Google's impression threshold, so this means <b>not captured</b> — not proof you don't rank. The term list is AI-generated, so review it for clinical accuracy before using it as a content brief.</div>
    </div>`:''}

    <div class="card mt"><h2>Top matched queries</h2>
      <table><thead><tr><th>Query</th><th>Lang</th><th class="num">Clicks</th><th class="num">Impr</th><th class="num">Pos</th></tr></thead><tbody>
      ${(d.matched||[]).slice(0,40).map(m=>`<tr><td class="strong i18n">${esc(m.query)}</td>
        <td><span class="pill ${m.langSource==='url'?'':'grey'}">${esc((m.lang||'').toUpperCase())}</span></td>
        <td class="num">${num(m.clicks)}</td><td class="num">${num(m.impressions)}</td><td class="num">${m.position??'—'}</td></tr>`).join('')||'<tr><td colspan="5" class="num">none</td></tr>'}
      </tbody></table>
      <div class="note">A coloured language pill means the language was read from the page URL locale (reliable). A grey pill means it was inferred from the query's script, which cannot separate English, German, Vietnamese and Indonesian.</div>
    </div>
  `;
}

// ============================================================ USERS
async function loadUsers() {
  if (S.users) return S.users;
  setStatus('busy', 'loading access list…');
  const res = await fetch('/api/users');
  if (!res.ok) throw new Error(`Server ${res.status}: ${(await res.text()).slice(0,180)}`);
  S.users = await res.json();
  setStatus('ok', `${S.users.users.length} user(s) configured`);
  return S.users;
}

function renderUsers() {
  const d = S.users;
  if (!d) {
    $('viewRoot').innerHTML = `<div class="card"><div class="state"><div class="big">Loading access list…</div></div></div>`;
    loadUsers().then(render).catch(e => { $('viewRoot').innerHTML = errorState(e.message); });
    return;
  }
  const tabs = (d.allTabs || []).filter(t => !t.adminOnly);

  const row = (u) => `<tr data-email="${esc(u.email)}">
    <td class="strong">${esc(u.email)}${u.note?`<div style="font-size:10.5px;color:var(--faint);font-weight:400;">${esc(u.note)}</div>`:''}</td>
    ${tabs.map(t=>`<td class="num"><input type="checkbox" data-tab="${esc(t.id)}" ${(u.tabs||[]).includes(t.id)?'checked':''}></td>`).join('')}
    <td class="num"><button class="btn btn-ghost" data-save="${esc(u.email)}" style="padding:5px 10px;font-size:11px;">Save</button></td>
    <td class="num"><button class="btn btn-ghost" data-del="${esc(u.email)}" style="padding:5px 10px;font-size:11px;color:var(--rose);">Remove</button></td>
  </tr>`;

  $('viewRoot').innerHTML = `
    ${d.persistence!=='gcs'?`<div class="warnbox"><b>Changes won't survive a restart.</b> No storage bucket is configured, so the access list is held in memory only and resets whenever Cloud Run cold-starts. Set <code>ACCESS_BUCKET</code> to a Cloud Storage bucket to make it durable.</div>`:''}

    <div class="card">
      <h2>Permanent admins</h2>
      <div style="font-size:12.5px;color:var(--ink-2);line-height:1.9;">
        ${(d.admins||[]).map(a=>`<code>${esc(a)}</code>`).join(' · ')}
      </div>
      <div class="note">Set by deployment config (<code>ADMIN_EMAILS</code>), not editable here — that's deliberate, so a mistake in the list below can never lock everyone out. Admins always see every tab.</div>
    </div>

    <div class="card mt">
      <h2>Add or update a user</h2>
      <div class="search">
        <input class="text" id="newEmail" placeholder="name@bangkokhospital.com" autocomplete="off">
        <input class="text" id="newNote" placeholder="Role or note (optional)" style="max-width:220px;min-width:160px;">
        <button class="btn btn-primary" id="addUser">Add</button>
      </div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;">
        ${tabs.map(t=>`<label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" class="newTab" value="${esc(t.id)}" ${d.defaultTabs.includes(t.id)?'checked':''}> ${esc(t.label)}
        </label>`).join('')}
      </div>
      <div class="note">Adding someone here shapes what they see. It does <b>not</b> let them in — they must also be granted IAP access in Google Cloud, which is the actual gate. Someone with IAP access but no entry below sees only: ${d.defaultTabs.length?d.defaultTabs.map(esc).join(', '):'nothing'}.</div>

      <div class="warnbox" style="margin-top:12px;">
        <b>Step 1 — grant IAP access first, or they'll see "You don't have access".</b><br>
        Open <a href="https://console.cloud.google.com/welcome?project=ai-reporting-503911&cloudshell=true" target="_blank" rel="noopener">Cloud Shell</a>, paste this command (it fills in as you type the email above), then come back and click Add.
        <pre id="iapCmd" style="margin:8px 0 6px;padding:10px 12px;background:rgba(0,0,0,.05);border-radius:8px;font-size:11.5px;line-height:1.6;overflow-x:auto;white-space:pre;"></pre>
        <button class="btn btn-ghost" id="copyIapCmd" style="padding:5px 10px;font-size:11px;">Copy command</button>
        <span id="iapCopied" style="font-size:11px;color:var(--faint);margin-left:8px;"></span>
      </div>
    </div>

    <div class="card mt">
      <h2>Configured users · ${(d.users||[]).length}</h2>
      <table><thead><tr><th>User</th>${tabs.map(t=>`<th class="num">${esc(t.label)}</th>`).join('')}<th></th><th></th></tr></thead>
      <tbody>${(d.users||[]).map(row).join('')||`<tr><td colspan="${tabs.length+3}" class="num">No users configured yet — everyone with IAP access sees the default tabs.</td></tr>`}</tbody></table>
      <div class="note">Tick the tabs a person should see, then Save that row. Tabs they lack are hidden from their sidebar, and the matching API refuses their requests too — the hiding isn't the only barrier.</div>
    </div>
  `;

  const collect = (email) => {
    const tr = document.querySelector(`tr[data-email="${CSS.escape(email)}"]`);
    return [...tr.querySelectorAll('input[data-tab]')].filter(i=>i.checked).map(i=>i.dataset.tab);
  };
  const post = async (body) => {
    const res = await fetch('/api/users', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body) });
    if (!res.ok) throw new Error(`${res.status}: ${(await res.text()).slice(0,160)}`);
    return res.json();
  };

  const persistWarn = (r) => {
    if (r.persisted) return;
    alert('WARNING: this change was NOT saved to Cloud Storage — it lives in memory and will disappear on the next restart or deploy.\n\nMost likely cause: the runtime service account lacks "Storage Object Admin" on the ACCESS_BUCKET, or the bucket name is wrong. Check Cloud Storage > ai-reporting-access > Permissions.');
  };

  document.querySelectorAll('[data-save]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true; b.textContent = 'Saving…';
    try {
      const email = b.dataset.save;
      const r = await post({ email, tabs: collect(email) });
      S.users.users = r.users; setStatus(r.persisted?'ok':'bad', r.persisted ? 'saved' : 'NOT saved to bucket'); persistWarn(r); render();
    } catch (e) { setStatus('bad','save failed'); alert(e.message); b.disabled = false; b.textContent = 'Save'; }
  }));

  document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm(`Remove ${b.dataset.del}? They'll fall back to the default tabs.`)) return;
    b.disabled = true;
    try {
      const res = await fetch(`/api/users?email=${encodeURIComponent(b.dataset.del)}`, { method:'DELETE' });
      if (!res.ok) throw new Error(`${res.status}: ${(await res.text()).slice(0,160)}`);
      const r = await res.json(); S.users.users = r.users; render();
    } catch (e) { alert(e.message); b.disabled = false; }
  }));

  const iapCmdFor = (email) => [
    'gcloud iap web add-iam-policy-binding \\',
    '  --project=ai-reporting-503911 \\',
    '  --resource-type=cloud-run --service=ai-reporting-git \\',
    '  --region=asia-southeast1 \\',
    `  --member="user:${email || 'NEW.PERSON@bangkokhospital.com'}" \\`,
    '  --role="roles/iap.httpsResourceAccessor" --condition=None',
  ].join('\n');
  const refreshIapCmd = () => { $('iapCmd').textContent = iapCmdFor($('newEmail').value.trim().toLowerCase()); };
  refreshIapCmd();
  $('newEmail').addEventListener('input', refreshIapCmd);
  $('copyIapCmd').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText($('iapCmd').textContent);
      $('iapCopied').textContent = 'copied — paste it in Cloud Shell';
    } catch { $('iapCopied').textContent = 'copy failed — select the text manually'; }
    setTimeout(() => { $('iapCopied').textContent = ''; }, 4000);
  });

  $('addUser').addEventListener('click', async () => {
    const email = $('newEmail').value.trim();
    if (!email) { $('newEmail').focus(); return; }
    const tabs2 = [...document.querySelectorAll('.newTab')].filter(i=>i.checked).map(i=>i.value);
    try {
      const r = await post({ email, tabs: tabs2, note: $('newNote').value.trim() });
      S.users.users = r.users; setStatus(r.persisted?'ok':'bad', r.persisted?'added':'NOT saved to bucket'); persistWarn(r); render();

const STAR_COLORS = { s5:'#3BC97F', s4:'#9FD98C', s3:'#F2C94C', s2:'#F0A45C', s1:'#F2708F' };
const RATING_LINE = '#5B57E8';   // purple-blue: reads clearly over the greens

/**
 * Total-count labels above each stacked bar. Chart.js has no built-in data
 * labels and the datalabels plugin isn't vendored, so this draws them directly.
 * Labels are skipped when bars get too narrow to hold a number without
 * colliding — better absent than overlapping.
 */
const ratingDotLabels = {
  id: 'ratingDotLabels',
  afterDatasetsDraw(chart) {
    const idx = chart.data.datasets.findIndex((ds) => ds.type === 'line' && ds._showPointLabels);
    if (idx === -1 || !chart.isDatasetVisible(idx)) return;
    const meta = chart.getDatasetMeta(idx);
    const pts = meta.data || [];
    if (!pts.length) return;
    const step = pts.length > 1 ? Math.abs(pts[1].x - pts[0].x) : 40;
    if (step < 20) return;
    const every = step < 34 ? 2 : 1;   // thin the labels out when space is tight
    const { ctx } = chart;
    ctx.save();
    ctx.font = '600 9.5px Poppins, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(255,255,255,.95)';
    pts.forEach((pt, i) => {
      if (i % every !== 0 && i !== pts.length - 1) return;
      const v = chart.data.datasets[idx].data[i];
      if (v == null) return;
      const txt = Number(v).toFixed(2);
      // Halo first so the number stays legible wherever it lands.
      ctx.strokeText(txt, pt.x, pt.y - 7);
      ctx.fillStyle = RATING_LINE;
      ctx.fillText(txt, pt.x, pt.y - 7);
    });
    ctx.restore();
  },
};

const stackTotalLabels = {
  id: 'stackTotalLabels',
  afterDatasetsDraw(chart) {
    const { ctx } = chart;
    const barSets = chart.data.datasets
      .map((ds, i) => ({ ds, i }))
      .filter(({ ds, i }) => (ds.type || chart.config.type) === 'bar' && chart.isDatasetVisible(i));
    if (!barSets.length) return;

    const first = chart.getDatasetMeta(barSets[0].i);
    const barW = first.data.length > 1
      ? Math.abs(first.data[1].x - first.data[0].x)
      : (first.data[0] ? first.data[0].width || 40 : 40);
    if (barW < 22) return;

    ctx.save();
    ctx.font = '600 9.5px Poppins, sans-serif';
    ctx.fillStyle = '#4C5878';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    const n0 = first.data.length;
    for (let i = 0; i < n0; i++) {
      let total = 0, topY = Infinity, x = null;
      for (const { i: di } of barSets) {
        const meta = chart.getDatasetMeta(di);
        const el = meta.data[i];
        if (!el) continue;
        total += Number(chart.data.datasets[di].data[i]) || 0;
        if (el.y < topY) topY = el.y;
        x = el.x;
      }
      if (!total || x == null) continue;
      ctx.fillText(total.toLocaleString(), x, topY - 4);
    }
    ctx.restore();
  },
};

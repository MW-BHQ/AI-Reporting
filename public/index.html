<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Room · Bangkok Hospital</title>
<link rel="icon" type="image/png" href="/brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Chart.js stays self-hosted: a blocked CDN here breaks the page, not just the type. -->
<script src="/vendor/chart.umd.js"></script>
<style>
  /* Fonts: Poppins (Latin) + Sarabun (Thai) from Google Fonts CDN.
     Google's own CSS carries per-subset unicode-range, so Sarabun only claims
     Thai codepoints and Poppins keeps Latin. If the CDN is ever blocked the
     page degrades to a system font — cosmetic only, nothing breaks. */

  :root{
    --bg:#EEF2FB;
    --bg-2:#E4EAF7;
    --glass:rgba(255,255,255,.72);
    --glass-2:rgba(255,255,255,.55);
    --stroke:rgba(255,255,255,.85);
    --line:rgba(90,110,160,.14);
    --ink:#1B2340;
    --ink-2:#4C5878;
    --muted:#8590AC;
    --faint:#A7B0C7;
    --violet:#7C6BF5;
    --violet-soft:#EDEAFE;
    --blue:#4B8DF8;
    --teal:#35C3B4;
    --amber:#F2A93B;
    --rose:#F2708F;
    --green:#3BC97F;
    --shadow:0 8px 30px rgba(43,60,110,.09);
    --shadow-sm:0 2px 10px rgba(43,60,110,.06);
    --r:18px;
    --r-sm:12px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 700px at 88% -12%, #DCE6FF 0%, rgba(220,230,255,0) 60%),
      radial-gradient(900px 600px at -8% 8%, #E8E3FF 0%, rgba(232,227,255,0) 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Poppins','Sarabun',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:14px;
  }
  /* Thai and other scripts fall through Poppins to Sarabun, then system */
  .i18n{font-family:'Poppins','Sarabun',system-ui,'Noto Sans Thai','Noto Sans JP','Noto Sans Arabic','Noto Sans Myanmar','Noto Sans Khmer',sans-serif;}

  .shell{display:flex;min-height:100vh;}

  /* ---------------- left rail ---------------- */
  .rail{
    width:236px;flex:none;padding:22px 16px;
    display:flex;flex-direction:column;gap:26px;
    background:var(--glass);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-right:1px solid var(--line);
    position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;flex-direction:column;gap:12px;padding:2px 8px 0;}
  .brand-logo{width:150px;height:auto;display:block;}
  .brand-app{padding-top:11px;border-top:1px solid var(--line);}
  .brand-name{font-weight:600;font-size:14.5px;line-height:1.15;}
  .brand-sub{font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;}

  .nav{display:flex;flex-direction:column;gap:4px;}
  .nav-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:0 10px 6px;}
  .nav-item{
    display:flex;align-items:center;gap:11px;
    padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;
    color:var(--ink-2);font-size:13.5px;font-weight:500;
    border:1px solid transparent;transition:.16s;
  }
  .nav-item:hover{background:var(--glass-2);color:var(--ink);}
  .nav-item.active{
    background:#fff;color:var(--violet);border-color:var(--stroke);
    box-shadow:var(--shadow-sm);font-weight:600;
  }
  .nav-item svg{width:17px;height:17px;flex:none;}

  .rail-foot{margin-top:auto;padding:12px;border-radius:var(--r-sm);background:var(--glass-2);border:1px solid var(--line);}
  .rail-foot .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);}
  .rail-foot .v{font-size:12px;color:var(--ink-2);margin-top:3px;}

  /* ---------------- main ---------------- */
  .main{flex:1;min-width:0;padding:26px 30px 60px;}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:20px;}
  h1{font-size:25px;font-weight:600;margin:0;letter-spacing:-.02em;}
  .subtitle{color:var(--muted);font-size:13px;margin-top:3px;}

  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .seg{display:flex;gap:3px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:4px;backdrop-filter:blur(10px);}
  .seg button{
    border:none;background:transparent;color:var(--ink-2);font-family:inherit;
    font-size:12px;font-weight:500;padding:7px 12px;border-radius:9px;cursor:pointer;transition:.15s;
  }
  .seg button:hover{color:var(--ink);}
  .seg button.active{background:#fff;color:var(--violet);font-weight:600;box-shadow:var(--shadow-sm);}
  .dates{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:7px 11px;}
  .dates input{background:transparent;border:none;color:var(--ink);font-family:inherit;font-size:12px;width:104px;}
  .dates input:focus{outline:none;}
  .dates span{color:var(--faint);}
  .btn{
    border:none;border-radius:12px;font-family:inherit;font-size:12.5px;font-weight:600;
    padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s;
  }
  .btn-primary{background:linear-gradient(135deg,var(--violet),#6A7BF7);color:#fff;box-shadow:0 4px 14px rgba(124,107,245,.32);}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-primary:disabled{opacity:.55;cursor:wait;}
  .btn-ghost{background:var(--glass);border:1px solid var(--line);color:var(--ink-2);}
  .spin{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;animation:sp .7s linear infinite;display:none;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .btn.loading .spin{display:inline-block;}

  .status{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;}
  .dot.idle{background:var(--faint);}
  .dot.busy{background:var(--amber);}
  .dot.bad{background:var(--rose);}

  /* ---------------- cards ---------------- */
  .card{
    background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);
    box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    padding:18px 20px;
  }
  .card h2{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;}
  .grid{display:grid;gap:14px;}
  .g-4{grid-template-columns:repeat(4,1fr);}
  .g-5{grid-template-columns:repeat(5,1fr);}
  .g-3{grid-template-columns:repeat(3,1fr);}
  .g-2-1{grid-template-columns:1.6fr 1fr;}
  .mt{margin-top:14px;}

  .stat .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);display:flex;align-items:center;gap:6px;}
  .stat .val{font-size:23px;font-weight:600;margin-top:7px;letter-spacing:-.02em;}
  .stat .val.na{color:var(--faint);font-weight:500;font-size:19px;}
  .stat .sub{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .chip{width:7px;height:7px;border-radius:50%;display:inline-block;}

  /* ---------------- funnel ---------------- */
  .stage{margin-bottom:16px;}
  .stage:last-child{margin-bottom:0;}
  .stage-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
  .stage-name{font-size:12.5px;font-weight:600;}
  .stage-val{font-size:16px;font-weight:600;}
  .stage-val.na{color:var(--faint);font-size:13px;font-weight:500;}
  .bar{display:flex;height:30px;border-radius:9px;overflow:hidden;background:rgba(140,155,190,.13);}
  .bar span{display:block;height:100%;transition:width .5s cubic-bezier(.4,0,.2,1);position:relative;}
  .bar span:hover{filter:brightness(1.08);}
  .stage-note{font-size:10.5px;color:var(--faint);margin-top:5px;}
  /* Minor stages read as supporting context, not headline numbers. */
  .stage.minor{padding-left:16px;border-left:2px solid rgba(140,155,190,.22);margin-bottom:14px;}
  .stage.minor .stage-name{font-weight:500;font-size:11.5px;color:var(--muted);}
  .stage.minor .stage-val{font-size:13px;font-weight:500;color:var(--muted);}
  .stage.minor .bar{height:16px;border-radius:6px;background:rgba(140,155,190,.10);}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);}
  .legend div{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);}

  /* ---------------- tables ---------------- */
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--muted);font-weight:500;font-size:11.5px;letter-spacing:0;padding:0 8px 9px 0;border-bottom:1px solid var(--line);white-space:nowrap;}
  th.num{text-align:right;padding-right:0;}
  /* Long ad/campaign names truncate; the full string is on hover. */
  td.trunc{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  td.trunc:hover{cursor:help;}
  td{padding:9px 0;border-bottom:1px solid var(--line);color:var(--ink-2);}
  td.strong{color:var(--ink);font-weight:500;}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  tr:last-child td{border-bottom:none;}
  tr.grp td{
    background:rgba(124,107,245,.05);color:var(--muted);
    font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:600;
    padding:8px 0 8px 10px;border-bottom:1px solid var(--line);
  }
  tr.tot td{font-weight:600;color:var(--ink);border-top:2px solid var(--line);background:rgba(140,155,190,.05);}
  td.dim{color:var(--faint);opacity:.5;}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:500;background:var(--violet-soft);color:var(--violet);}
  .pill.warn{background:#FFF1E6;color:#D97B1F;}
  .pill.grey{background:rgba(140,155,190,.14);color:var(--muted);}

  /* ---------------- topic / campaign inputs ---------------- */
  .search{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .search input.text{
    flex:1;min-width:230px;background:#fff;border:1px solid var(--line);border-radius:13px;
    padding:12px 15px;color:var(--ink);font-family:inherit;font-size:14px;box-shadow:var(--shadow-sm);
  }
  .search input.text:focus{outline:none;border-color:var(--violet);}
  .hint{font-size:11.5px;color:var(--muted);margin:0 0 14px;}
  .tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
  .tag{background:var(--glass);border:1px solid var(--line);color:var(--ink-2);border-radius:20px;padding:6px 13px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s;}
  .tag:hover{border-color:var(--violet);color:var(--violet);}
  .qtag{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px;margin:0 6px 6px 0;font-size:12px;}
  .gap-tag{display:inline-block;border:1px dashed var(--rose);color:var(--rose);border-radius:8px;padding:5px 10px;margin:0 6px 6px 0;font-size:12px;background:#FFF7F9;}
  .cluster{background:var(--glass-2);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px;}
  .cluster h3{margin:0 0 10px;font-size:13px;color:var(--violet);font-weight:600;}

  .state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 20px;gap:9px;text-align:center;color:var(--muted);}
  .state .big{font-size:14px;font-weight:600;color:var(--ink-2);}
  .state.bad .big{color:var(--rose);}
  .note{font-size:11.5px;color:var(--faint);margin-top:12px;padding-top:11px;border-top:1px solid var(--line);}
  .warnbox{background:#FFF8EC;border:1px solid #FBE3BE;color:#9A6712;border-radius:12px;padding:11px 14px;font-size:12px;margin-bottom:14px;}
  .chart-wrap{height:250px;}
  .hidden{display:none!important;}

  /* ---------------- print / PDF: 16:9 presentation ---------------- */
  .acct-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:2px;}
  .acct-tab{
    background:var(--glass);border:1px solid var(--line);color:var(--ink-2);
    border-radius:11px;padding:8px 13px;font-family:inherit;font-size:12px;cursor:pointer;transition:.15s;
    display:flex;align-items:baseline;gap:7px;
  }
  .acct-tab:hover{border-color:var(--violet);}
  .acct-tab.active{background:#fff;color:var(--violet);font-weight:600;border-color:var(--stroke);box-shadow:var(--shadow-sm);}
  .acct-tab small{font-size:10.5px;color:var(--faint);font-weight:400;}
  .acct-tab.active small{color:var(--violet);opacity:.75;}

  .print-head{display:none;}
  @media print{
    /* 13.333in x 7.5in is the standard 16:9 slide canvas. */
    @page{size:13.333in 7.5in;margin:0.45in;}
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
    body{background:#fff!important;font-size:11px;}
    .rail,.toolbar,.status,.search,.tags,.btn,#loadBtn,.no-print,.acct-tabs{display:none!important;}
    .shell{display:block;}
    .main{padding:0!important;}
    .head{margin-bottom:10px;border-bottom:1px solid #d8dfee;padding-bottom:8px;}
    h1{font-size:20px;}
    .print-head{
      display:flex!important;align-items:center;justify-content:space-between;
      gap:14px;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid #1B2340;
    }
    .print-head img{width:132px;height:auto;}
    .print-head .pmeta{text-align:right;font-size:10.5px;color:#4C5878;line-height:1.5;}
    .card{
      background:#fff!important;box-shadow:none!important;backdrop-filter:none!important;
      border:1px solid #dde3f0!important;border-radius:10px;padding:12px 14px;
      break-inside:avoid;page-break-inside:avoid;
    }
    .grid{gap:10px;break-inside:avoid;page-break-inside:avoid;}
    .mt{margin-top:10px;}
    .stat .val{font-size:17px;}
    .chart-wrap{height:150px;}
    /* Keep a campaign report to a single slide. */
    .card h2{font-size:10.5px;margin-bottom:8px;}
    .stat .lab{font-size:8.5px;}
    .stat .sub{font-size:8px;}
    table{font-size:10px;}
    td,th{padding:5px 0;}
    td.trunc{max-width:200px;}
    .note,.stage-note{font-size:9px;}
    /* Force a new slide before these blocks so sections don't split awkwardly. */
    .slide-break{break-before:page;page-break-before:always;}
    a{color:#1B2340!important;text-decoration:none!important;}
  }

  @media(max-width:1080px){.g-5,.g-4{grid-template-columns:repeat(2,1fr);}.g-2-1,.g-3{grid-template-columns:1fr;}}
  @media(max-width:760px){
    .shell{flex-direction:column;}
    .rail{width:auto;height:auto;position:static;flex-direction:row;align-items:center;gap:14px;overflow-x:auto;}
    .nav{flex-direction:row;}.nav-label,.rail-foot,.brand-app{display:none;}
    .brand{flex-direction:row;padding:0;}.brand-logo{width:112px;}
    .main{padding:18px 16px 40px;}
  }
</style>
</head>
<body>
<div class="shell">
  <!-- ================= left rail ================= -->
  <aside class="rail">
    <div class="brand">
      <img class="brand-logo" src="/brand/bh-wordmark.png" alt="Bangkok Hospital">
      <div class="brand-app">
        <div class="brand-name">Control Room</div>
        <div class="brand-sub">Marketing Division</div>
      </div>
    </div>

    <nav class="nav">
      <div class="nav-label">Reporting</div>
      <div class="nav-item active" data-view="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
        Overview
      </div>
      <div class="nav-item" data-view="campaigns">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>
        Campaigns
      </div>
      <div class="nav-item" data-view="gbp">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6L3.4 9.4l6-.8z"/></svg>
        Google Profile
      </div>
      <div class="nav-item" data-view="benchmark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        Benchmarks
      </div>
      <div class="nav-item" data-view="audit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9"/></svg>
        Tagging audit
      </div>
      <div class="nav-item" data-view="topics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        Topic Explorer
      </div>
      <div class="nav-item" data-view="users" data-admin="1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.2 2.7-5 6-5s6 1.8 6 5"/><path d="M17 11h4M19 9v4"/></svg>
        Users
      </div>
    </nav>

    <div class="rail-foot">
      <div class="k">Data source</div>
      <div class="v">GA4 Group + Windsor.ai</div>
      <div class="k" style="margin-top:9px;">Build</div>
      <div class="v" id="verLabel">—</div>
    </div>
  </aside>

  <!-- ================= main ================= -->
  <main class="main">
    <div class="print-head">
      <img src="/brand/bh-wordmark.png" alt="Bangkok Hospital">
      <div class="pmeta">
        <div><b id="printTitle">Control Room</b></div>
        <div id="printRange"></div>
      </div>
    </div>
    <div class="head">
      <div>
        <h1 id="viewTitle">Overview</h1>
        <div class="subtitle" id="viewSub">Impressions → Visits → Key Events across all channels</div>
      </div>
      <div class="toolbar">
        <div class="seg" id="presets">
          <button data-days="7">7D</button>
          <button data-days="30" class="active">30D</button>
          <button data-days="90">90D</button>
          <button data-month="1">MTD</button>
        </div>
        <div class="dates">
          <input type="date" id="from"><span>→</span><input type="date" id="to">
        </div>
        <button class="btn btn-primary" id="loadBtn"><span class="spin"></span><span id="loadLabel">Load</span></button>
        <button class="btn btn-ghost" id="printBtn" title="Print or save as PDF at 16:9 slide size">PDF</button>
      </div>
    </div>
    <div class="status" style="margin-bottom:18px;">
      <span class="dot idle" id="statusDot"></span><span id="statusText">ready</span>
    </div>

    <div id="viewRoot"></div>
  </main>
</div>

<script>
// ============================================================ state & helpers
const S = {
  view: 'overview',
  from: null, to: null,
  overview: null,       // cached per range key
  overviewKey: null,
  campaign: null, campaignCode: '',
  campaignList: null, campaignListKey: null,
  topic: null, topicTerm: '',
  audit: null, auditKey: null,
  bench: null, benchKey: null, benchTab: null,
  gbp: null, gbpKey: null, gbpTab: null, gbpInit: false,
  me: null, users: null,
  charts: {},
};

const $ = (id) => document.getElementById(id);
const fmtISO = (d) => d.toISOString().slice(0, 10);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/** null means "we could not measure this" — render as an em dash, never 0. */
function num(v, opts = {}) {
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  const a = Math.abs(v);
  if (opts.money) {
    if (a >= 1e6) return '฿' + (v/1e6).toFixed(2) + 'M';
    if (a >= 1e3) return '฿' + (v/1e3).toFixed(1) + 'K';
    return '฿' + v.toFixed(0);
  }
  if (opts.pct) return v.toFixed(opts.dp ?? 1) + '%';
  if (opts.dp !== undefined) return v.toFixed(opts.dp);
  if (a >= 1e6) return (v/1e6).toFixed(1) + 'M';
  if (a >= 1e3) return (v/1e3).toFixed(1) + 'K';
  return String(Math.round(v));
}
const isNA = (v) => v === null || v === undefined;

const CHANNEL_COLORS = ['#7C6BF5','#4B8DF8','#35C3B4','#F2A93B','#F2708F','#3BC97F','#9B8CEF','#6ECBE0','#E8A0C4','#A8B4D4'];
const colorFor = (i) => CHANNEL_COLORS[i % CHANNEL_COLORS.length];

function setStatus(kind, text) {
  $('statusDot').className = 'dot ' + (kind === 'ok' ? '' : kind);
  $('statusText').textContent = text;
}

// ============================================================ date controls
function setDays(days) {
  const to = new Date(), from = new Date();
  from.setDate(to.getDate() - (days - 1));
  $('from').value = fmtISO(from); $('to').value = fmtISO(to);
}
function setMTD() {
  const now = new Date();
  $('from').value = fmtISO(new Date(now.getFullYear(), now.getMonth(), 1));
  $('to').value = fmtISO(now);
}
$('presets').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('presets').children].forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  if (b.dataset.days) setDays(+b.dataset.days); else setMTD();
});
['from','to'].forEach(id => $(id).addEventListener('change', () =>
  [...$('presets').children].forEach(b => b.classList.remove('active'))));
setDays(30);

// ============================================================ navigation
// Client-side only: switching tabs never refetches, which was the whole point.
function goTo(view, { push = true } = {}) {
  if (!S.me || !S.me.tabs.includes(view)) return;
  S.view = view;
  document.querySelectorAll('.nav-item').forEach(i => i.classList.toggle('active', i.dataset.view === view));
  // Tabs are addressable, so a view can be bookmarked or sent to a colleague.
  if (push && location.hash.slice(1) !== view) location.hash = view;
}

window.addEventListener('hashchange', () => {
  const v = location.hash.slice(1);
  if (v && v !== S.view && S.me && S.me.tabs.includes(v)) { goTo(v, { push:false }); render(); }
});

document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    if (!S.me || !S.me.tabs.includes(item.dataset.view)) return;
    goTo(item.dataset.view);
    if (S.view === 'gbp' && !S.gbpInit) {
      // Reviews accumulate slowly, so a year is the useful default window.
      const y = new Date(); y.setDate(y.getDate() - 1);
      const start = new Date(y); start.setFullYear(start.getFullYear() - 1); start.setDate(start.getDate() + 1);
      $('from').value = fmtISO(start); $('to').value = fmtISO(y);
      [...$('presets').children].forEach(b => b.classList.remove('active'));
      S.gbpInit = true;
    }
    render();
  });
});

// Views where the toolbar date range has no meaning.
const NO_DATE_VIEWS = new Set(['benchmark', 'users']);

const TITLES = {
  overview: ['Overview', 'Impressions → Visits → Key Events across all channels'],
  campaigns: ['Campaigns', 'Enter a utm_campaign code to see its funnel and every variant'],
  topics: ['Topic Explorer', 'Multilingual search demand across 10 site languages'],
  users: ['Users', 'Who can see which tab'],
  audit: ['Tagging audit', 'How much traffic and spend the campaign view cannot attribute'],
  benchmark: ['Benchmarks', 'Latest complete month against trailing 3, 6 and 12-month norms'],
  gbp: ['Google Business Profile', 'Reviews and ratings by listing'],
};

// ============================================================ fetching
async function loadOverview(refresh = false) {
  const key = `${$('from').value}|${$('to').value}`;
  if (!refresh && S.overviewKey === key && S.overview) return S.overview;
  setStatus('busy', 'pulling GA4, Meta, Search Console, GMB, LINE…');
  const url = `/api/overview?from=${$('from').value}&to=${$('to').value}${refresh ? '&refresh=1' : ''}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Server ${res.status}: ${(await res.text()).slice(0,200)}`);
  S.overview = await res.json(); S.overviewKey = key;
  setStatus('ok', S.overview.cached ? `cached ${S.overview.cacheAgeSec}s ago` : `synced ${new Date().toLocaleTimeString()}`);
  return S.overview;
}

async function loadCampaign(code, refresh = false) {
  setStatus('busy', `matching “${code}”…`);
  const url = `/api/campaign?code=${encodeURIComponent(code)}&from=${$('from').value}&to=${$('to').value}${refresh?'&refresh=1':''}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Server ${res.status}: ${(await res.text()).slice(0,200)}`);
  S.campaign = await res.json(); S.campaignCode = code;
  setStatus('ok', S.campaign.cached ? `cached ${S.campaign.cacheAgeSec}s ago` : `synced ${new Date().toLocaleTimeString()}`);
  return S.campaign;
}

async function loadCampaignList() {
  const key = `${$('from').value}|${$('to').value}`;
  if (S.campaignListKey === key && S.campaignList) return S.campaignList;
  const res = await fetch(`/api/campaigns?from=${$('from').value}&to=${$('to').value}`);
  if (!res.ok) throw new Error(`Server ${res.status}`);
  S.campaignList = await res.json(); S.campaignListKey = key;
  return S.campaignList;
}

async function loadGbp(refresh = false) {
  const key = `${$('from').value}|${$('to').value}`;
  if (!refresh && S.gbpKey === key && S.gbp) return S.gbp;
  setStatus('busy', 'pulling reviews for all listings…');
  const res = await fetch(`/api/gbp?from=${$('from').value}&to=${$('to').value}${refresh?'&refresh=1':''}`);

  S.gbp = await res.json(); S.gbpKey = key;

  return S.gbp;
}

async function loadBenchmark(refresh = false) {
  const key = $('to').value;
  if (!refresh && S.benchKey === key && S.bench) return S.bench;
  setStatus('busy', 'building 12-month benchmark…');
  const res = await fetch(`/api/benchmark?to=${$('to').value}${refresh?'&refresh=1':''}`);
  if (!res.ok) throw new Error(`Server ${res.status}: ${(await res.text()).slice(0,200)}`);
  S.bench = await res.json(); S.benchKey = key;
  setStatus('ok', S.bench.cached ? `cached ${S.bench.cacheAgeSec}s ago` : `synced ${new Date().toLocaleTimeString()}`);
  return S.bench;
}

async function loadAudit(refresh = false) {
  const key = `${$('from').value}|${$('to').value}`;
  if (!refresh && S.auditKey === key && S.audit) return S.audit;
  setStatus('busy', 'auditing campaign tagging…');
  const res = await fetch(`/api/untagged?from=${$('from').value}&to=${$('to').value}${refresh?'&refresh=1':''}`);
  if (!res.ok) throw new Error(`Server ${res.status}: ${(await res.text()).slice(0,200)}`);
  S.audit = await res.json(); S.auditKey = key;

async function loadTopic(topic) {
  setStatus('busy', `expanding “${topic}” across 10 languages…`);
  const res = await fetch('/api/topic', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ topic, from: $('from').value, to: $('to').value }),
  });
  if (!res.ok) throw new Error(`Server ${res.status}: ${(await res.text()).slice(0,220)}`);
  S.topic = await res.json(); S.topicTerm = topic;
  setStatus('ok', S.topic.cached ? `cached ${S.topic.cacheAgeSec}s ago` : `synced ${new Date().toLocaleTimeString()}`);
  return S.topic;
}

$('loadBtn').addEventListener('click', async () => {
  const btn = $('loadBtn');
  btn.disabled = true; btn.classList.add('loading'); $('loadLabel').textContent = 'Loading…';
  try {
    if (S.view === 'overview') { await loadOverview(true); }
    else if (S.view === 'campaigns') {
      S.campaignList = null; S.campaignListKey = null;
      if (S.campaignCode) await loadCampaign(S.campaignCode, true);
    }
    else if (S.view === 'audit') { await loadAudit(true); }
    else if (S.view === 'benchmark') { await loadBenchmark(true); }
    else if (S.view === 'gbp') { await loadGbp(true); }
    else if (S.view === 'users') { S.users = null; await loadUsers(); }
    else if (S.view === 'topics' && S.topicTerm) { await loadTopic(S.topicTerm); }
    render();
  } catch (err) {
    setStatus('bad', 'failed');
    $('viewRoot').innerHTML = errorState(err.message);
  } finally {
    btn.disabled = false; btn.classList.remove('loading'); $('loadLabel').textContent = 'Load';
  }
});

const errorState = (msg) => `<div class="card"><div class="state bad"><div class="big">Something went wrong</div>
  <div style="max-width:460px;font-size:12.5px;">${esc(msg)}</div></div></div>`;
const loadingState = (msg) => `<div class="card"><div class="state"><div class="big">${esc(msg)}</div>
  <div style="font-size:12px;">Live pull — a few seconds.</div></div></div>`;

// ============================================================ render: shell
function render() {
  const [t, s] = TITLES[S.view];
  $('viewTitle').textContent = t; $('viewSub').textContent = s;
  // The benchmark is inherently trailing, so a range picker would only mislead.
  const hideDates = NO_DATE_VIEWS.has(S.view);
  document.querySelector('.dates').classList.toggle('hidden', hideDates);
  $('presets').classList.toggle('hidden', hideDates);
  Object.values(S.charts).forEach(c => { try { c.destroy(); } catch(_){} });
  S.charts = {};
  if (S.view === 'overview') renderOverview();
  else if (S.view === 'campaigns') renderCampaigns();
  else if (S.view === 'audit') renderAudit();
  else if (S.view === 'benchmark') renderBenchmark();
  else if (S.view === 'gbp') renderGbp();
  else if (S.view === 'users') renderUsers();
  else renderTopics();
}

// ============================================================ CAMPAIGNS
function renderCampaigns() {
  const d = S.campaign;
  $('viewRoot').innerHTML = `
    <div class="search">
      <input class="text" id="campInput" placeholder="utm_campaign code — e.g. 260501 or 260601-03_bgh" value="${esc(S.campaignCode)}" autocomplete="off">
      <button class="btn btn-primary" id="campGo"><span class="spin"></span><span>Analyse</span></button>
      <button class="btn btn-ghost" id="campBrowse">Browse codes</button>
    </div>
    <p class="hint">Prefix match, case-insensitive. Type <b>260501</b> to roll up every <b>260501-*</b> variant, or a fuller code to narrow it. Visits and key events come from GA4; impressions are matched from Meta Ads campaign names.</p>
    <div id="campBody">${d ? '' : `<div class="card"><div class="state"><div class="big">No campaign loaded</div>
      <div style="max-width:420px;font-size:12.5px;">Enter a code above, or press <b>Browse codes</b> to see what ran in this date range.</div></div></div>`}</div>
  `;
  if (d) renderCampaignBody(d);

  $('campGo').addEventListener('click', runCampaign);
  $('campInput').addEventListener('keydown', e => { if (e.key === 'Enter') runCampaign(); });
  $('campBrowse').addEventListener('click', browseCampaigns);
}

async function runCampaign() {
  const code = $('campInput').value.trim();
  if (code.length < 2) { $('campInput').focus(); return; }
  const btn = $('campGo'); btn.disabled = true; btn.classList.add('loading');
  $('campBody').innerHTML = loadingState(`Matching “${code}”…`);
  try { renderCampaignBody(await loadCampaign(code)); }
  catch (err) { setStatus('bad','failed'); $('campBody').innerHTML = errorState(err.message); }
  finally { btn.disabled = false; btn.classList.remove('loading'); }
}

async function browseCampaigns() {
  $('campBody').innerHTML = loadingState('Listing campaign codes…');
  try {
    const l = await loadCampaignList();
    const rows = (l.campaigns||[]).slice(0,60).map(c => `<tr>
      <td class="strong i18n" style="cursor:pointer" data-code="${esc(c.code)}">
        ${c.topic?`${esc(c.topic)}<div style="font-size:10.5px;color:var(--faint);font-weight:400;">${esc(c.code)}</div>`:esc(c.code)}
        ${c.untagged?'<span class="pill warn" style="margin-left:7px;">untagged</span>':''}</td>
      <td class="num">${num(c.visits)}</td></tr>`).join('');
    $('campBody').innerHTML = `<div class="card">
      <h2>Campaign codes in range · ${l.total} total</h2>
      ${l.untaggedCount ? `<div class="warnbox"><b>${l.untaggedCount} codes look untagged.</b> They are bare numeric platform IDs, which means those ads reached GA4 without a proper utm_campaign — so they can't be grouped with their campaign. Worth fixing at the tagging step.</div>` : ''}
      <table><thead><tr><th>Campaign (click to analyse)</th><th class="num">Visits</th></tr></thead><tbody>${rows||'<tr><td colspan="2" class="num">none</td></tr>'}</tbody></table>
    </div>`;
    $('campBody').querySelectorAll('td[data-code]').forEach(td => td.addEventListener('click', () => {
      $('campInput').value = td.dataset.code; runCampaign();
    }));
  } catch (err) { $('campBody').innerHTML = errorState(err.message); }
}

        : `<div style="max-width:480px;font-size:12.5px;">No GA4 traffic and no ad campaigns carry this prefix between ${esc(d.range.from)} and ${esc(d.range.to)}. Check the spelling, try a shorter prefix, or browse the codes that did run.</div>`}

function renderTopics() {
  const d = S.topic;
  $('viewRoot').innerHTML = `
    <div class="search">
      <input class="text i18n" id="topicInput" placeholder="Clinical topic — e.g. gallbladder" value="${esc(S.topicTerm)}" autocomplete="off">
      <button class="btn btn-primary" id="topicGo"><span class="spin"></span><span>Explore</span></button>
    </div>
    <p class="hint">Claude expands the topic across Thai, English, Chinese, Japanese, Arabic, German, Burmese, Vietnamese, Khmer &amp; Indonesian, then matches it against what the site actually ranks for. Language is read from the ranking page's URL locale, not guessed from the script.</p>
    <div class="tags">${['gallbladder','heart disease','cancer screening','knee replacement','diabetes'].map(t=>`<button class="tag" data-t="${t}">${t}</button>`).join('')}</div>
    <div id="topicBody">${d?'':`<div class="card"><div class="state"><div class="big">No topic explored yet</div>
      <div style="max-width:420px;font-size:12.5px;">Enter a clinical topic to see multilingual search demand and content gaps.</div></div></div>`}</div>
  `;
  if (d) renderTopicBody(d);
  $('topicGo').addEventListener('click', runTopic);
  $('topicInput').addEventListener('keydown', e => { if (e.key==='Enter') runTopic(); });
  document.querySelectorAll('.tag').forEach(b => b.addEventListener('click', () => {
    $('topicInput').value = b.dataset.t; runTopic();
  }));
}

async function runTopic() {
  const topic = $('topicInput').value.trim();
  if (!topic) { $('topicInput').focus(); return; }
  const btn = $('topicGo'); btn.disabled = true; btn.classList.add('loading');
  $('topicBody').innerHTML = loadingState(`Exploring “${topic}” across 10 languages…`);
  try { renderTopicBody(await loadTopic(topic)); }
  catch (err) { setStatus('bad','failed'); $('topicBody').innerHTML = errorState(err.message); }
  finally { btn.disabled = false; btn.classList.remove('loading'); }
}

    </div>`:''}

    <div class="card mt"><h2>Top matched queries</h2>
      <table><thead><tr><th>Query</th><th>Lang</th><th class="num">Clicks</th><th class="num">Impr</th><th class="num">Pos</th></tr></thead><tbody>
      ${(d.matched||[]).slice(0,40).map(m=>`<tr><td class="strong i18n">${esc(m.query)}</td>
        <td><span class="pill ${m.langSource==='url'?'':'grey'}">${esc((m.lang||'').toUpperCase())}</span></td>
        <td class="num">${num(m.clicks)}</td><td class="num">${num(m.impressions)}</td><td class="num">${m.position??'—'}</td></tr>`).join('')||'<tr><td colspan="5" class="num">none</td></tr>'}
      </tbody></table>
      <div class="note">A coloured language pill means the language was read from the page URL locale (reliable). A grey pill means it was inferred from the query's script, which cannot separate English, German, Vietnamese and Indonesian.</div>
    </div>
  `;
}

async function loadUsers() {
  if (S.users) return S.users;
  setStatus('busy', 'loading access list…');
  const res = await fetch('/api/users');
  if (!res.ok) throw new Error(`Server ${res.status}: ${(await res.text()).slice(0,180)}`);
  S.users = await res.json();
  setStatus('ok', `${S.users.users.length} user(s) configured`);
  return S.users;
}

    $('viewRoot').innerHTML = `<div class="card"><div class="state"><div class="big">Loading access list…</div></div></div>`;

    } catch (e) { setStatus('bad','save failed'); alert(e.message); b.disabled = false; b.textContent = 'Save'; }

  document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm(`Remove ${b.dataset.del}? They'll fall back to the default tabs.`)) return;
    b.disabled = true;
    try {
      const res = await fetch(`/api/users?email=${encodeURIComponent(b.dataset.del)}`, { method:'DELETE' });
      if (!res.ok) throw new Error(`${res.status}: ${(await res.text()).slice(0,160)}`);
      const r = await res.json(); S.users.users = r.users; render();
    } catch (e) { alert(e.message); b.disabled = false; }
  }));

  const iapCmdFor = (email) => [
    'gcloud iap web add-iam-policy-binding \\',
    '  --project=ai-reporting-503911 \\',
    '  --resource-type=cloud-run --service=ai-reporting-git \\',
    '  --region=asia-southeast1 \\',
    `  --member="user:${email || 'NEW.PERSON@bangkokhospital.com'}" \\`,
    '  --role="roles/iap.httpsResourceAccessor" --condition=None',
  ].join('\n');
  const refreshIapCmd = () => { $('iapCmd').textContent = iapCmdFor($('newEmail').value.trim().toLowerCase()); };
  refreshIapCmd();
  $('newEmail').addEventListener('input', refreshIapCmd);
  $('copyIapCmd').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText($('iapCmd').textContent);
      $('iapCopied').textContent = 'copied — paste it in Cloud Shell';
    } catch { $('iapCopied').textContent = 'copy failed — select the text manually'; }
    setTimeout(() => { $('iapCopied').textContent = ''; }, 4000);
  });

  $('addUser').addEventListener('click', async () => {
    const email = $('newEmail').value.trim();
    if (!email) { $('newEmail').focus(); return; }
    const tabs2 = [...document.querySelectorAll('.newTab')].filter(i=>i.checked).map(i=>i.value);
    try {
      const r = await post({ email, tabs: tabs2, note: $('newNote').value.trim() });
      S.users.users = r.users; setStatus('ok', r.persisted?'added':'added in memory only'); render();
    } catch (e) { alert(e.message); }
  });
}

// ============================================================ GBP
const STAR_COLORS = { s5:'#3BC97F', s4:'#9FD98C', s3:'#F2C94C', s2:'#F0A45C', s1:'#F2708F' };
const RATING_LINE = '#5B57E8';   // purple-blue: reads clearly over the greens

/**
 * Total-count labels above each stacked bar. Chart.js has no built-in data
 * labels and the datalabels plugin isn't vendored, so this draws them directly.
 * Labels are skipped when bars get too narrow to hold a number without
 * colliding — better absent than overlapping.
 */
const ratingDotLabels = {
  id: 'ratingDotLabels',
  afterDatasetsDraw(chart) {
    const idx = chart.data.datasets.findIndex((ds) => ds.type === 'line' && ds._showPointLabels);
    if (idx === -1 || !chart.isDatasetVisible(idx)) return;
    const meta = chart.getDatasetMeta(idx);
    const pts = meta.data || [];
    if (!pts.length) return;
    const step = pts.length > 1 ? Math.abs(pts[1].x - pts[0].x) : 40;
    if (step < 20) return;
    const every = step < 34 ? 2 : 1;   // thin the labels out when space is tight
    const { ctx } = chart;
    ctx.save();
    ctx.font = '600 9.5px Poppins, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(255,255,255,.95)';
    pts.forEach((pt, i) => {
      if (i % every !== 0 && i !== pts.length - 1) return;
      const v = chart.data.datasets[idx].data[i];
      if (v == null) return;
      const txt = Number(v).toFixed(2);
      // Halo first so the number stays legible wherever it lands.
      ctx.strokeText(txt, pt.x, pt.y - 7);
      ctx.fillStyle = RATING_LINE;
      ctx.fillText(txt, pt.x, pt.y - 7);
    });
    ctx.restore();
  },
};

const stackTotalLabels = {
  id: 'stackTotalLabels',
  afterDatasetsDraw(chart) {
    const { ctx } = chart;
    const barSets = chart.data.datasets
      .map((ds, i) => ({ ds, i }))
      .filter(({ ds, i }) => (ds.type || chart.config.type) === 'bar' && chart.isDatasetVisible(i));
    if (!barSets.length) return;

    const first = chart.getDatasetMeta(barSets[0].i);
    const barW = first.data.length > 1
      ? Math.abs(first.data[1].x - first.data[0].x)
      : (first.data[0] ? first.data[0].width || 40 : 40);
    if (barW < 22) return;

    ctx.save();
    ctx.font = '600 9.5px Poppins, sans-serif';
    ctx.fillStyle = '#4C5878';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    const n0 = first.data.length;
    for (let i = 0; i < n0; i++) {
      let total = 0, topY = Infinity, x = null;
      for (const { i: di } of barSets) {
        const meta = chart.getDatasetMeta(di);
        const el = meta.data[i];
        if (!el) continue;
        total += Number(chart.data.datasets[di].data[i]) || 0;
        if (el.y < topY) topY = el.y;
        x = el.x;
      }
      if (!total || x == null) continue;
      ctx.fillText(total.toLocaleString(), x, topY - 4);
    }
    ctx.restore();
  },
};

function renderGbp() {
  const d = S.gbp;
  if (!d) {
    $('viewRoot').innerHTML = `<div class="card"><div class="state">
      <div class="big">Ready to load reviews</div>
      <div style="max-width:470px;font-size:12.5px;">The range defaults to the last 12 months ending yesterday. Press <b>Load</b>.</div>
    </div></div>`;
    return;
  }
  const list = d.listings || [];
  if (!list.length) { $('viewRoot').innerHTML = errorState('No listings returned for this range.'); return; }
  if (!S.gbpTab || !list.some(l => l.key === S.gbpTab)) S.gbpTab = list[0].key;
  const L = list.find(l => l.key === S.gbpTab);

  const tabStrip = `<div class="acct-tabs">${list.map(l=>`
    <button class="acct-tab ${l.key===S.gbpTab?'active':''}" data-gtab="${esc(l.key)}" title="${esc(l.title)}">
      ${esc(l.key)}<small>${l.allTimeRating!=null?l.allTimeRating.toFixed(1)+'★':''} ${num(l.allTimeCount)}</small>
    </button>`).join('')}</div>`;

  const totalStars = ['s1','s2','s3','s4','s5'].reduce((a,k)=>a+L.stars[k],0);
  const starRow = (k, n_) => {
    const pct = totalStars ? (n_/totalStars)*100 : 0;
    return `<tr>
      <td class="strong" style="width:70px;">${k.slice(1)} ★</td>
      <td style="width:100%"><div style="background:rgba(140,155,190,.13);border-radius:5px;height:9px;overflow:hidden;">
        <div style="width:${pct}%;height:100%;background:${STAR_COLORS[k]};"></div></div></td>
      <td class="num" style="width:70px;">${num(n_)}</td>
      <td class="num" style="width:60px;color:var(--muted)">${totalStars?pct.toFixed(1)+'%':'—'}</td>
    </tr>`;
  };

  $('viewRoot').innerHTML = `
    ${tabStrip}
    ${d.unparsedStars?`<div class="warnbox">${d.unparsedStars} review(s) had a star rating this build couldn't read, so they're excluded from the breakdown.</div>`:''}
    ${L.unlisted?`<div class="warnbox">This listing wasn't in the five you specified, but the account returns it — showing it rather than dropping data.</div>`:''}

    <div class="grid g-5">
      <div class="stat card"><div class="lab">All-time rating</div>
        <div class="val" style="color:${L.allTimeRating>=4.5?'var(--green)':(L.allTimeRating>=4?'var(--amber)':'var(--rose)')}">${L.allTimeRating!=null?L.allTimeRating.toFixed(1)+' ★':'—'}</div>
        <div class="sub">${num(L.allTimeCount)} reviews total</div></div>
      <div class="stat card"><div class="lab">Reviews in period</div>
        <div class="val">${num(L.periodCount)}</div>
        <div class="sub">${esc(d.range.from)} → ${esc(d.range.to)}</div></div>
      <div class="stat card"><div class="lab">Rating in period</div>
        <div class="val">${L.periodRating!=null?L.periodRating.toFixed(2)+' ★':'—'}</div>
        <div class="sub">${L.allTimeRating!=null&&L.periodRating!=null?(L.periodRating>=L.allTimeRating?'at or above':'below')+' all-time':''}</div></div>
      <div class="stat card"><div class="lab">Profile views</div>
        <div class="val ${isNA(L.impressions)?'na':''}">${num(L.impressions)}</div>
        <div class="sub">${num(L.calls)} calls · ${num(L.directions)} directions</div></div>
      <div class="stat card"><div class="lab">1–3★ recently</div>
        <div class="val" style="${L.recentNegatives?'color:var(--rose)':''}">${num(L.recentNegatives)}</div>
        <div class="sub">since ${esc(d.recentFrom)}</div></div>
    </div>

    <div class="card mt">
      <h2>Reviews by month &middot; stars stacked, rating overlaid</h2>
      <div style="height:300px;"><canvas id="gbpChart"></canvas></div>
      <div class="note">Bars stack the count of 1–5★ reviews received each month, 5★ at the base so low ratings stay visible on top; the number above each bar is that month's total. The purple line is the <b>all-time rating as it stood at the end of each month</b> — the score a patient would have seen on Google at that moment — with its value printed above each dot. Hover a month to see that month's own average instead. Reviews predating this range still count toward the line: the opening balance is derived from the listing's all-time total, which Google publishes rounded to one decimal, so the line can sit a fraction of a star off in absolute terms while its trend is exact.${L.cumulativeBasis==='range-only'?' <b>All-time totals were unavailable for this listing, so the line accumulates only from reviews in this range and reads low at the start.</b>':''}</div>
    </div>

    <div class="grid g-2-1 mt">
      <div class="card"><h2>Star distribution &middot; period</h2>
        <table><tbody>${['s5','s4','s3','s2','s1'].map(k=>starRow(k,L.stars[k])).join('')}</tbody></table>
        <div class="note">${num(totalStars)} reviews in the selected range.</div>
      </div>
      <div class="card"><h2>All listings</h2>
        <table><thead><tr><th>Listing</th><th class="num">Rating</th><th class="num">Total</th></tr></thead><tbody>
        ${list.map(l=>`<tr style="${l.key===S.gbpTab?'background:rgba(124,107,245,.05)':''}">
          <td class="strong" style="cursor:pointer" data-gtab2="${esc(l.key)}">${esc(l.key)}<div style="font-size:10px;color:var(--faint);font-weight:400;">${esc(l.title.slice(0,32))}</div></td>
          <td class="num" style="color:${l.allTimeRating>=4.5?'var(--green)':(l.allTimeRating>=4?'var(--amber)':'var(--rose)')};font-weight:600;">${l.allTimeRating!=null?l.allTimeRating.toFixed(1):'—'}</td>
          <td class="num">${num(l.allTimeCount)}</td></tr>`).join('')}
        </tbody></table>
      </div>
    </div>

    ${(L.recent||[]).length?`<div class="card mt no-print">
      <h2>Recent reviews &middot; since ${esc(d.recentFrom)}${L.recentUnreplied?` &middot; ${L.recentUnreplied} without a reply`:''}</h2>
      <table><thead><tr><th style="width:52px;">Stars</th><th>Review</th><th style="width:92px;">Date</th><th style="width:66px;">Replied</th></tr></thead><tbody>
      ${L.recent.map(r=>`<tr>
        <td class="strong" style="color:${r.star>=4?'var(--green)':(r.star==3?'var(--amber)':'var(--rose)')};">${r.star?r.star+' ★':'—'}</td>
        <td class="i18n" style="white-space:normal;font-size:12px;">${r.comment?esc(r.comment):'<span style="color:var(--faint)">rating only, no comment</span>'}
          ${r.reviewer?`<div style="font-size:10.5px;color:var(--faint);margin-top:3px;">${esc(r.reviewer)}</div>`:''}</td>
        <td style="font-size:11px;color:var(--muted)">${esc(String(r.at||'').slice(0,10))}</td>
        <td>${r.replied?'<span class="pill">yes</span>':'<span class="pill warn">no</span>'}</td>
      </tr>`).join('')}
      </tbody></table>
    </div>`:''}
  `;

  document.querySelectorAll('[data-gtab]').forEach(b=>b.addEventListener('click',()=>{ S.gbpTab=b.dataset.gtab; renderGbp(); }));
  document.querySelectorAll('[data-gtab2]').forEach(b=>b.addEventListener('click',()=>{ S.gbpTab=b.dataset.gtab2; renderGbp(); }));

  // stacked stars + rating line
  const el = document.getElementById('gbpChart');
  try {
    if (typeof Chart === 'undefined') throw new Error('chart library unavailable');
    const series = L.series || [];
    S.charts.gbpChart = new Chart(el, {
      plugins: [stackTotalLabels, ratingDotLabels],
      data: {
        labels: series.map(m=>m.label),
        // 5★ first puts it at the base of the stack, so the low ratings sit on
        // top where they're actually visible instead of buried under the green.
        datasets: [
          { type:'line', label:'All-time rating', yAxisID:'y1', _showPointLabels:true,
            data: series.map(m=>m.cumRating),
            borderColor:RATING_LINE, backgroundColor:RATING_LINE, borderWidth:2.5, tension:.35,
            pointRadius:3, pointBackgroundColor:RATING_LINE, pointBorderColor:'#fff', pointBorderWidth:1.5,
            spanGaps:true, order:0 },
          ...['s5','s4','s3','s2','s1'].map(k=>({
            type:'bar', label:`${k.slice(1)}★`, data:series.map(m=>m[k]),
            backgroundColor:STAR_COLORS[k], stack:'stars',
            borderWidth:0, borderColor:'transparent', borderRadius:0, borderSkipped:false,
          })),
        ],
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        layout:{ padding:{ top:16 } },
        interaction:{mode:'index', intersect:false},
        plugins:{
          legend:{ labels:{ color:'#4C5878', font:{family:'Poppins',size:10.5}, usePointStyle:true, boxWidth:8 } },
          tooltip:{ callbacks:{
            // The dot already carries the all-time figure, so the tooltip is
            // free to answer the other question: how did THIS month do?
            label:(c)=>{
              if (c.dataset.type !== 'line') return ` ${c.dataset.label}: ${c.parsed.y}`;
              const m = series[c.dataIndex];
              if (!m || !m.count) return ' This month: no reviews';
              return ` This month: ${(m.ratingSum/m.count).toFixed(2)} ★ from ${m.count} review${m.count>1?'s':''}`;
            },
            footer:(items)=>{
              const m = series[items[0].dataIndex];
              return m && m.cumRating != null ? `All-time after this month: ${m.cumRating.toFixed(2)} ★` : '';
            },
          } },
        },
        scales:{
          x:{ stacked:true, ticks:{ color:'#A7B0C7', font:{family:'Poppins',size:10} }, grid:{ display:false } },
          y:{ stacked:true, beginAtZero:true, title:{display:true,text:'Reviews',color:'#A7B0C7',font:{size:10}},
              ticks:{ color:'#A7B0C7', font:{size:10}, precision:0 }, grid:{ color:'rgba(90,110,160,.09)' } },
          y1:{ position:'right',
               // The running all-time score moves in hundredths, so a full 1-5
               // axis would flatten it into a straight line. Padded around the
               // observed range instead, with the floor never above 4.
               min: (()=>{ const v=series.map(m=>m.cumRating).filter(x=>x!=null); if(!v.length) return 1;
                           return Math.max(1, Math.min(4, Math.floor((Math.min(...v)-0.15)*10)/10)); })(),
               max: 5,
               title:{display:true,text:'Rating (all-time)',color:'#A7B0C7',font:{size:10}},
               ticks:{ color:'#A7B0C7', font:{size:10} }, grid:{ display:false } },
        },
      },
    });
  } catch (e) {
    console.error('gbp chart failed:', e);
    const box = el && el.parentElement;
    if (box) box.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--faint);font-size:12px;">Chart unavailable. The distribution table below still shows the breakdown.</div>`;
  }
}

// ============================================================ BENCHMARK
function renderBenchmark() {
  const d = S.bench;
  if (!d) {
    $('viewRoot').innerHTML = `<div class="card"><div class="state">
      <div class="big">Ready to benchmark</div>
      <div style="max-width:500px;font-size:12.5px;">Press <b>Load</b>. This always reads the last 12 <b>complete</b> calendar months, so a partial month can't flatter the comparison. Results are stored and reused until the month rolls over.</div>
    </div></div>`;
    return;
  }
  const tabs = [d.all, ...(d.accounts || [])];
  if (!S.benchTab || !tabs.some(t => t.id === S.benchTab)) S.benchTab = d.all.id;
  const a = tabs.find(t => t.id === S.benchTab) || d.all;
  const isAll = a.id === '__all__';

  const tabStrip = `<div class="acct-tabs">${tabs.map(t => `
    <button class="acct-tab ${t.id===S.benchTab?'active':''}" data-tab="${esc(t.id)}">
      ${esc(t.account)}<small>${num(t.spend3m,{money:true})}</small>
    </button>`).join('')}</div>`;

  const chip = (cell, lowerIsBetter) => {
    if (!cell) return '<span style="color:var(--faint)">—</span>';
    const p = cell.deltaPct;
    const good = lowerIsBetter ? p < 0 : p > 0;
    const flat = Math.abs(p) < 2;
    const col = flat ? 'var(--muted)' : (good ? 'var(--green)' : 'var(--rose)');
    return `<span style="color:${col};font-weight:600;">${flat?'':(p>0?'▲':'▼')} ${Math.abs(p).toFixed(0)}%</span>`;
  };
  const fmt = (v, money) => v == null ? '—' : (money ? num(v,{money:true}) : num(v,{dp:2}));
  const w = a.windows;

  $('viewRoot').innerHTML = `
    ${tabStrip}
    ${d.coverage.monthsWithData < d.coverage.completeMonths ? `<div class="warnbox">Only <b>${d.coverage.monthsWithData}</b> of the last ${d.coverage.completeMonths} complete months have data, so the 12-month window covers less than a year. Empty months are treated as missing history, not as zeros.</div>` : ''}

    <div class="grid g-4">
      <div class="stat card"><div class="lab">Latest complete month</div>
        <div class="val">${esc(a.latestMonth?a.latestMonth.label:'—')}</div>
        <div class="sub">compared against below</div></div>
      <div class="stat card"><div class="lab">Avg monthly spend · 3M</div>
        <div class="val">${w.m3?num(w.m3.avgMonthlySpend,{money:true}):'—'}</div>
        <div class="sub">${w.m3?`${w.m3.months} month${w.m3.months>1?'s':''} with data`:''}</div></div>
      <div class="stat card"><div class="lab">Avg monthly spend · 6M</div>
        <div class="val">${w.m6?num(w.m6.avgMonthlySpend,{money:true}):'—'}</div>
        <div class="sub">${w.m6?`${w.m6.months} months`:''}</div></div>
      <div class="stat card"><div class="lab">Avg monthly spend · 12M</div>
        <div class="val">${w.m12?num(w.m12.avgMonthlySpend,{money:true}):'—'}</div>
        <div class="sub">${w.m12?`${w.m12.months} months`:''}</div></div>
    </div>

    ${(a.goals||[]).length?`<div class="card mt">
      <h2>Efficiency by campaign objective · last 12 months</h2>
      <table><thead><tr><th>Objective</th><th class="num">Spend</th><th class="num">Results</th>
        <th class="num">Cost per result</th><th class="num">Results / ฿1k</th><th class="num">CPM</th></tr></thead><tbody>
      ${a.goals.map(g=>`<tr>
        <td class="strong">${esc(g.label)}<div style="font-size:10.5px;color:var(--faint);font-weight:400;">per ${esc(g.resultLabel)} · from ${esc(g.source)}</div></td>
        <td class="num">${num(g.spend,{money:true})}</td>
        <td class="num">${num(g.resultCount)}</td>
        <td class="num" style="font-weight:600;color:var(--ink)">${num(g.costPerResult,{money:true})}</td>
        <td class="num">${g.resultsPerK!=null?num(g.resultsPerK,{dp:1}):'—'}</td>
        <td class="num">${num(g.cpm,{money:true})}</td>
      </tr>`).join('')}
      </tbody></table>
      <div class="note">Each objective is judged on its own result, because a shared metric would be meaningless across them: a lead-form ad never sends anyone to the site, so cost per visit doesn't apply, and a message ad's outcome is a conversation. Results marked <b>from Meta</b> are counted by the platform and survive missing utm tags; results <b>from GA4</b> depend on correct tagging. Objective comes from Meta's own <code>campaign_objective</code>, falling back to the campaign name only when that's blank.</div>
    </div>`:''}

    <div class="card mt">
      <h2>${esc(a.latestMonth?a.latestMonth.label:'Latest month')} vs trailing norms${isAll?'':' · '+esc(a.account)}</h2>
      <table><thead><tr>
        <th>Metric</th><th class="num">Latest</th>
        <th class="num">3M</th><th class="num">vs</th>
        <th class="num">6M</th><th class="num">vs</th>
        <th class="num">12M</th><th class="num">vs</th>
      </tr></thead><tbody>
      ${(a.comparison||[]).map(m=>`<tr>
        <td class="strong">${esc(m.label)}</td>
        <td class="num" style="font-weight:600;color:var(--ink)">${fmt(m.current,m.money)}</td>
        <td class="num">${fmt(m.vs.m3?m.vs.m3.base:null,m.money)}</td><td class="num">${chip(m.vs.m3,m.lowerIsBetter)}</td>
        <td class="num">${fmt(m.vs.m6?m.vs.m6.base:null,m.money)}</td><td class="num">${chip(m.vs.m6,m.lowerIsBetter)}</td>
        <td class="num">${fmt(m.vs.m12?m.vs.m12.base:null,m.money)}</td><td class="num">${chip(m.vs.m12,m.lowerIsBetter)}</td>
      </tr>`).join('')||'<tr><td colspan="8" class="num">no comparable months</td></tr>'}
      </tbody></table>
      <div class="note">Green means favourable, not upward — a fall in cost per contact is green, a fall in results per ฿1,000 is red. Window figures derive from summed totals across the window, so a quiet month can't swing the norm as hard as a heavy one. Deltas under 2% show without an arrow.${isAll?'':' Site metrics for a single account are attributed by matching the campaign code in its ad names against tagged utm_campaign values, so untagged campaigns in this account are absent from visit-based rows.'}</div>
    </div>

    <div class="card mt">
      <h2>Monthly trend${isAll?'':' · '+esc(a.account)}</h2>
      <div class="chart-wrap"><canvas id="benchChart"></canvas></div>
    </div>

    <div class="card mt slide-break no-print">
      <h2>Month by month</h2>
      <table><thead><tr>
        <th>Month</th><th class="num">Spend</th><th class="num">Impr</th><th class="num">Clicks</th>
        <th class="num">Leads</th><th class="num">Conv.</th>${isAll?'<th class="num">Visits</th><th class="num">Key ev.</th>':''}
        <th class="num">CPM</th><th class="num">CPC</th>
      </tr></thead><tbody>
      ${(a.series||[]).slice().reverse().map(m=>{
        const empty=!m.spend&&!m.visits;
        return `<tr${empty?' style="opacity:.45"':''}>
        <td class="strong">${esc(m.label)}${empty?' <span class="pill grey">no data</span>':''}</td>
        <td class="num">${num(m.spend,{money:true})}</td>
        <td class="num">${num(m.impressions)}</td>
        <td class="num">${num(m.clicks)}</td>
        <td class="num">${num(m.leads)}</td>
        <td class="num">${num(m.messages)}</td>
        ${isAll?`<td class="num">${num(m.visits)}</td><td class="num">${num(m.keyEvents)}</td>`:''}
        <td class="num">${num(m.cpm,{money:true})}</td>
        <td class="num">${num(m.cpc,{money:true})}</td>
      </tr>`}).join('')}
      </tbody></table>
    </div>

    <div class="note" style="margin-top:12px;">Computed ${esc((d.computedAt||'').slice(0,16).replace('T',' '))} · stored for ${esc(d.storedFor||'')} (${esc(d.store||'memory')}) · reused until the month rolls over. Press Load to force a recompute.</div>
  `;

  document.querySelectorAll('.acct-tab').forEach(b => b.addEventListener('click', () => {
    S.benchTab = b.dataset.tab; renderBenchmark();
  }));

  const rows = (a.series||[]).filter(m=>m.spend||m.visits).map(m=>({
    d:m.label, spend:m.spend, cpm:m.cpm, cpc:m.cpc,
  }));
  drawChart('benchChart', rows, [
    { label:'Spend', key:'spend', color:'#F2A93B', axis:'y' },
    { label:'CPM', key:'cpm', color:'#F2708F', axis:'y1' },
    { label:'CPC', key:'cpc', color:'#35C3B4', axis:'y1' },
  ]);
}

// ============================================================ AUDIT
function renderAudit() {
  const d = S.audit;
  if (!d) {
    $('viewRoot').innerHTML = `<div class="card"><div class="state">
      <div class="big">Ready to audit</div>
      <div style="max-width:460px;font-size:12.5px;">Press <b>Load</b> to measure how much traffic and ad spend can't be tied to a campaign code — the blind spot in the Campaigns view.</div>
    </div></div>`;
    return;
  }
  const tr = d.traffic, sp = d.spend;
  const shareBad = tr.untaggedShare != null && tr.untaggedShare >= 10;

  $('viewRoot').innerHTML = `
    <div class="grid g-4">
      <div class="stat card"><div class="lab">Untagged visits</div>
        <div class="val" style="${shareBad?'color:var(--rose)':''}">${num(tr.untaggedVisits)}</div>
        <div class="sub">${tr.untaggedShare!=null?num(tr.untaggedShare,{pct:true})+' of all campaign traffic':''}</div></div>
      <div class="stat card"><div class="lab">Key events lost to it</div>
        <div class="val">${num(tr.untaggedKeyEvents)}</div>
        <div class="sub">can't be credited to any campaign</div></div>
      <div class="stat card"><div class="lab">Unattributable ad spend</div>
        <div class="val ${isNA(sp.unmatched)?'na':''}" style="${sp.unmatchedShare>=10?'color:var(--rose)':''}">${num(sp.unmatched,{money:true})}</div>
        <div class="sub">${sp.unmatchedShare!=null?num(sp.unmatchedShare,{pct:true})+' of '+num(sp.total,{money:true}):''}</div></div>
      <div class="stat card"><div class="lab">Codes tracking properly</div>
        <div class="val">${num(d.taggedCodes)}</div>
        <div class="sub">${num(tr.taggedVisits)} visits</div></div>
    </div>

    <div class="card mt">
      <h2>Traffic that can't be attributed</h2>
      <table><thead><tr><th>Cause</th><th class="num">Visits</th><th class="num">Key events</th><th>Examples</th></tr></thead><tbody>
      ${(tr.issues||[]).map(i=>`<tr>
        <td class="strong" style="max-width:330px;white-space:normal;">${esc(i.label)}</td>
        <td class="num">${num(i.visits)}</td><td class="num">${num(i.keyEvents)}</td>
        <td class="i18n" style="font-size:11px;color:var(--muted);max-width:300px;white-space:normal;">${i.examples.map(e=>`<code>${esc(e)}</code>`).join(', ')}</td>
      </tr>`).join('')||'<tr><td colspan="4" class="num">Nothing untagged in this range — tagging is clean.</td></tr>'}
      </tbody></table>
      <div class="note">Each row is a distinct failure mode, not a severity ranking. A bare platform ID means the ad's destination URL carried no <code>utm_campaign</code>, so GA4 recorded the platform's own campaign ID instead — those sessions are real, they just can't be grouped with the campaign they belong to.</div>
    </div>

    ${(sp.unmatchedCampaigns||[]).length?`<div class="card mt slide-break">
      <h2>Ad spend with no matching tagged campaign</h2>
      <table><thead><tr><th>Ad campaign</th><th>Account</th><th class="num">Impr</th><th class="num">Clicks</th><th class="num">Spend</th></tr></thead><tbody>
      ${sp.unmatchedCampaigns.map(c=>`<tr>
        <td class="strong i18n trunc" title="${esc(c.name)}">${esc(c.name)}</td>
        <td style="font-size:11px;color:var(--muted)">${esc(c.account)}</td>
        <td class="num">${num(c.impressions)}</td><td class="num">${num(c.clicks)}</td>
        <td class="num">${num(c.spend,{money:true})}</td>
      </tr>`).join('')}
      </tbody></table>
      <div class="note">These ad campaigns either carry no <code>YYMMDD-NN</code> code in their name, or carry one that no tagged utm_campaign matches. Their spend can be totalled but never linked to visits, key events or revenue — so it sits outside every efficiency figure in this dashboard.</div>
    </div>`:''}

    <div class="card mt">
      <h2>How to fix it</h2>
      <div style="font-size:12.5px;color:var(--ink-2);line-height:1.75;">
        <b>Bare platform IDs</b> — the ad's destination URL is missing <code>utm_campaign</code>. Add the code to the link when the ad is built; Meta won't backfill it, so historic sessions stay unattributable.<br>
        <b>Placeholders</b> — a template variable reached production unsubstituted. Worth a pre-launch check on the link, since it silently costs the whole campaign's attribution.<br>
        <b>Names without a code</b> — the ad ran with a name that doesn't follow <code>YYMMDD-NN</code>, so it can't be searched or dated here. Renaming in the platform fixes future reporting.
      </div>
    </div>
  `;
}

// ============================================================ charts
/**
 * Funnel as a log-scale bar chart. On a linear axis, 2.5K key events beside
 * 344.8K impressions is a bar one pixel tall; a log axis makes every stage
 * readable at once. Zero and null are dropped because log(0) is undefined.
 */
function drawFunnelChart(canvasId, stages) {
  const el = document.getElementById(canvasId);
  if (!el) return;
  const usable = stages.filter(s => s.value != null && s.value > 0);
  if (!usable.length) {
    const box = el.parentElement;
    if (box) box.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--faint);font-size:12px;">No funnel data for this campaign.</div>';
    return;
  }
  try {
    if (typeof Chart === 'undefined') throw new Error('chart library unavailable');
    S.charts[canvasId] = new Chart(el, {
      type: 'bar',
      data: { labels: usable.map(s=>s.label), datasets: [{
        data: usable.map(s=>s.value),
        backgroundColor: usable.map(s=>s.color),
        borderRadius: 6, borderSkipped: false, barPercentage: .72,
      }]},
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (c) => ` ${c.parsed.x.toLocaleString()}` } },
        },
        scales: {
          x: { type: 'logarithmic', ticks: { color:'#A7B0C7', font:{family:'Poppins',size:10},
                 callback: (v) => { const l=Math.log10(v); return Number.isInteger(l) ? (v>=1000?(v/1000)+'k':v) : ''; } },
               grid: { color:'rgba(90,110,160,.09)' } },
          y: { ticks: { color:'#4C5878', font:{family:'Poppins',size:11} }, grid: { display:false } },
        },
      },
    });
  } catch (e) {
    console.error('funnel chart failed:', e);
    const box = el.parentElement;
    if (box) box.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--faint);font-size:12px;">Chart unavailable. Figures are in the table below.</div>`;
  }
}

function drawChart(canvasId, rows, series) {
  const el = document.getElementById(canvasId);
  if (!el) return;
  try {
    if (typeof Chart === 'undefined') throw new Error('chart library unavailable');
    S.charts[canvasId] = new Chart(el, {
      type: 'line',
      data: {
        labels: rows.map(r => r.d),
        datasets: series.map(s => ({
          label: s.label, data: rows.map(r => r[s.key]),
          borderColor: s.color, backgroundColor: s.color + '22',
          tension: .35, fill: s.axis === 'y', yAxisID: s.axis, pointRadius: 0, borderWidth: 2,
        })),
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { labels: { color:'#4C5878', font:{family:'Poppins',size:11}, usePointStyle:true, boxWidth:7 } } },
        scales: {
          x: { ticks:{ color:'#A7B0C7', font:{family:'Poppins',size:10}, maxRotation:0, autoSkip:true, maxTicksLimit:8 }, grid:{ color:'rgba(90,110,160,.09)' } },
          y: { position:'left', ticks:{ color:'#A7B0C7', font:{size:10} }, grid:{ color:'rgba(90,110,160,.09)' } },
          y1:{ position:'right', ticks:{ color:'#A7B0C7', font:{size:10} }, grid:{ display:false } },
        },
      },
    });
  } catch (e) {
    console.error('chart failed:', e);
    const box = el.parentElement;
    if (box) box.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--faint);font-size:12px;text-align:center;">Chart unavailable (${esc(e.message)}).<br>Figures above are still live.</div>`;
  }
}

// ============================================================ boot
$('printBtn').addEventListener('click', () => {
  const [t] = TITLES[S.view];
  const extra = S.view === 'campaigns' && S.campaign ? ` — ${S.campaign.topic || S.campaign.code}` : '';
  $('printTitle').textContent = t + extra;
  $('printRange').textContent = `${$('from').value} to ${$('to').value} · generated ${new Date().toLocaleString()}`;
  window.print();
});

// Light tooltips across every chart — the default dark panel reads as harsh
// against a clinical light theme.
if (typeof Chart !== 'undefined') {
  Chart.defaults.font.family = 'Poppins, sans-serif';
  Object.assign(Chart.defaults.plugins.tooltip, {
    backgroundColor: 'rgba(255,255,255,.97)',
    titleColor: '#1B2340',
    bodyColor: '#4C5878',
    footerColor: '#8590AC',
    borderColor: 'rgba(90,110,160,.20)',
    borderWidth: 1,
    cornerRadius: 10,
    padding: 11,
    boxPadding: 5,
    usePointStyle: true,
    titleFont: { family: 'Poppins', size: 12, weight: '600' },
    bodyFont: { family: 'Poppins', size: 11.5 },
    footerFont: { family: 'Poppins', size: 10.5, weight: '400' },
  });
}

fetch('/api/version').then(r => r.json()).then(v => {
  $('verLabel').textContent = 'v' + v.version + (v.modelArmor ? ' · armor on' : '');
}).catch(() => { $('verLabel').textContent = 'unknown'; });

// Identity decides the nav before anything renders, so a user never glimpses a
// tab they can't open.
fetch('/api/me').then(r => r.json()).then(me => {
  S.me = me;
  document.querySelectorAll('.nav-item').forEach(item => {
    const allowed = me.tabs.includes(item.dataset.view);
    item.classList.toggle('hidden', !allowed);
  });
  if (me.email) {
    const foot = document.querySelector('.rail-foot');
    if (foot) foot.insertAdjacentHTML('afterbegin',
      `<div class="k">Signed in</div><div class="v" style="word-break:break-all;">${esc(me.email)}${me.isAdmin?' <span class="pill">admin</span>':''}</div>`);
  }
  const wanted = location.hash.slice(1);
  const start = (wanted && me.tabs.includes(wanted)) ? wanted : (me.tabs.find(t => t !== 'users') || me.tabs[0]);
  if (!start) {
    $('viewRoot').innerHTML = `<div class="card"><div class="state"><div class="big">No tabs assigned</div>
      <div style="max-width:420px;font-size:12.5px;">Your account is signed in${me.email?` as ${esc(me.email)}`:''} but hasn't been granted any views yet. Ask an admin to grant access.</div></div></div>`;
    return;
  }
  goTo(start, { push: !location.hash });
  render();
}).catch(() => {
  // Identity unavailable (local dev, or IAP not in front): show everything.
  S.me = { email: null, isAdmin: true, tabs: ['overview','campaigns','gbp','benchmark','audit','topics','users'], allTabs: [] };
  goTo(location.hash.slice(1) || 'overview', { push: false });
  render();
});
</script>

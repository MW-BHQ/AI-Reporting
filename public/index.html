Cost/result is priced on this:
Traffic — per landing page view
Leads — per lead
Message — per conversation
Reach — CPM
Sales — per catalog purchase

Read from Meta's ad set optimization goal, not the campaign name and not the campaign objective, which can disagree with it.

'mixed' means this audience ran under more than one goal. The label follows the goal with the most spend; open the row to see each campaign.">Obj<span class="ihint">i</span></span></th>
        <th class="num">Uses</th><th class="num">Spend ฿</th><th class="num">Impr</th>
        <th class="num"><span data-tip="Link clicks ÷ impressions. Independent of budget, so it compares audiences fairly.">CTR</span></th>
        <th class="num">Clicks</th>
        <th class="num">LPV</th>
        <th><span data-tip="Meta's own ad relevance diagnostics — Meta calculates these, the dashboard only displays them. Each compares this ad set against other advertisers competing for the same audience.

Q — Quality: how your ad's perceived quality compares.
E — Engagement rate: expected likelihood of clicks, reactions, comments or shares.
C — Conversion rate: expected likelihood of completing THIS ad set's own optimisation goal, compared only with ads buying that same goal. For a Traffic set the goal is the landing page view; for a Leads set it is the lead.

● green — above average
● grey — average
● amber + figure — below average; the figure is the bottom band, so 20% is worse than 35%
● red — bottom 10%
— dash — not rated

These are relative percentiles, not absolute scores, and they are forward-looking estimates rather than measured results. Meta needs 500+ impressions before rating an ad set, does not rate conversion for reach or impressions buys, and does not feed these into the auction. Meta's own guidance: use them to diagnose ad sets that are underperforming, not to tune ones already hitting their targets."><span class="qec-head"><b>Q</b><b>E</b><b>C</b></span><span class="ihint">i</span></span></th>
        <th class="num">CPM ฿</th><th class="num">Cost/result ฿</th><th></th>
      </tr></thead><tbody>
      ${list.map((a,i)=>`
        <tr class="aud-row" data-i="${i}" style="cursor:pointer;">
          <td class="strong trunc" style="max-width:0;" title="${esc(a.name)}">${esc(a.name)}</td>

            <span data-tip="${a.objective?esc(GOAL_FULL[a.objective]||a.objective)+' — Meta optimisation goal; Cost/result is priced on it.':'Meta returned no optimisation goal for this set, so it is priced per landing page view by default.'}${a.objectiveMix?' Used across '+a.objectiveMix.length+' goals: '+a.objectiveMix.map(m=>(GOAL_FULL[m.goal]||m.goal)+' '+Math.round(m.share*100)+'% of spend').join(', ')+'. The row follows the goal with the most spend; open it to see each campaign.':''}">${esc(GOAL_LABEL[a.objective]||'—')}${a.objectiveMix?` <span class="pill warn" style="font-size:9px;padding:1px 5px;">mixed</span>`:''}</span>
          </td>

          <td class="num">${fmtAmt(a.spend)}</td>
          <td class="num">${num(a.impressions)}</td>
          <td class="num">${pct(a.ctr)}</td>
          <td class="num">${num(a.clicks)}</td>
          <td class="num">${a.isCpas?'—':num(a.lpv)}</td>
          <td style="white-space:nowrap;">${rankDots(a.rankings)}</td>
          <td class="num">${fmtAmt(a.cpm)}</td>
          <td class="num strong" style="white-space:nowrap;">${a.lowVolume?'<span class="pill warn" title="Under 1,000 impressions — too little delivery for a cost-per to mean anything">too small</span>':a.primary.cost===null?'<span title="Spent money but the primary action never fired">—⚠</span>':fmtAmt(a.primary.cost)} ${a.lowVolume?'':kpiPill(a.primary)}</td>
          <td style="color:var(--faint);font-size:11px;">${S.audienceOpen===i?'▾':'▸'}</td>
        </tr>
        ${S.audienceOpen===i?`<tr><td colspan="12" style="background:var(--glass-2);padding:10px 14px;">
          <div style="font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.9;">
            Ad account${a.accounts.length>1?'s':''}: <b>${a.accounts.length?a.accounts.map(esc).join(' · '):'unknown'}</b>
            ${a.isCpas?'':` · click→visit rate: <b>${pct(a.lpvRate)}</b>`}
            · CPC: <b>${fmtTHB(a.cpc)}</b>
            · frequency: <b${a.frequency&&a.frequency>=3?' style="color:#D97B1F;"':''}>${a.frequency===null||a.frequency===undefined?'—':a.frequency.toFixed(2)}</b> <span style="color:var(--faint);">(above 3 means quite repeatedly)</span>
            ${a.isCpas?` · CPAS: ${num(a.purchases)} purchase${a.purchases===1?'':'s'}, ${fmtTHB(a.revenue)} revenue${a.roas?`, ROAS ${a.roas.toFixed(2)}×`:''}, ${num(a.atc)} add-to-cart`:''}
          </div>
          <table style="margin:0;"><thead><tr><th>Ad account</th><th>Campaign</th><th>Obj</th><th class="num">Spend ฿</th><th class="num">Impr</th><th class="num">CTR</th><th class="num">Clicks</th><th class="num">LPV</th><th class="num">Leads</th><th class="num">Msgs</th><th class="num">Cost/result ฿</th>${a.isCpas?'<th class="num">Purch</th><th class="num">Revenue ฿</th>':''}</tr></thead><tbody>
          ${a.campaigns.map(c=>`<tr>
            <td style="color:var(--muted);white-space:nowrap;">${esc(c.account||'—')}</td>
            <td class="trunc" title="${esc(c.campaign)}">${esc(c.campaign)}</td>
            <td style="white-space:nowrap;font-size:11px;color:var(--muted);" title="${esc(GOAL_FULL[c.goal]||c.goal||'no optimisation goal reported')}">${esc(GOAL_LABEL[c.goal]||'—')}</td>
            <td class="num">${fmtAmt(c.spend)}</td><td class="num">${num(c.impressions)}</td>
            <td class="num">${pct(c.impressions>0?c.clicks/c.impressions:null)}</td>
            <td class="num">${num(c.clicks)}</td><td class="num">${a.isCpas?'—':num(c.lpv)}</td>
            <td class="num">${c.leads?num(c.leads):'—'}</td><td class="num">${c.messages?num(c.messages):'—'}</td>
            <td class="num strong">${c.costPerResult==null?'—':fmtAmt(c.costPerResult)} <span style="color:var(--faint);font-size:10px;">${esc(c.resultLabel||'')}</span></td>
            ${a.isCpas?`<td class="num">${c.purchases?num(c.purchases):'—'}</td><td class="num">${c.revenue?fmtAmt(c.revenue):'—'}</td>`:''}</tr>`).join('')}
          </tbody></table>
        </td></tr>`:''}`).join('')}
      </tbody></table>
      ${d.catalogAvailable===false?`<div class="note" style="border-left:3px solid #D97B1F;padding-left:10px;margin-bottom:10px;">Meta rejected the full request this run, so it was retried without the Shopee catalog fields. CPAS purchases, revenue and ROAS are missing from this view — press Refresh to try the full pull again. Everything else is complete.</div>`:''}
      <div class="note"><b>Buying</b> is the ad set's Meta optimisation goal, and it decides which cost-per each row is judged on — a reach buy is priced on CPM, a WhatsApp buy per conversation, a leads buy per lead. This comes from Meta, not from campaign names, and not from the campaign objective: the WhatsApp sets report campaign objective "traffic" while actually optimising for conversations, so the campaign field would misjudge them.<br>
      One row per audience set, grouped by ad set name across all Meta campaigns ("– Copy" variants folded into the parent). Click a row for its per-campaign breakdown and ad account.<br>
      <b>CTR</b> is link clicks ÷ impressions — budget-independent, so it compares audiences fairly where impressions and clicks mostly track how much was spent. Click→visit rate and frequency are in the row expansion.<br>
      <b>Key ev. est</b> is apportioned, not measured: GA4 has no concept of an ad set, so each campaign's key events are split across the audiences that ran in it by their share of landing page views (spend share for CPAS). The split always sums back to GA4's campaign total, but a share is an assumption — treat it as a steer, never as a reported figure, and never as grounds for killing an audience on its own. Campaigns whose Meta name carries no <code>YYMMDD-NN</code> code can't be matched to GA4 at all and show "no code". <b>KE/visit</b> = those key events ÷ landing page views. Read it as "was this audience used on well-converting campaigns" — it cannot isolate the audience's own conversion quality, because the apportioning and the rate cancel out to the campaign's own rate. For genuine per-audience quality, use <b>CTR</b> and click→visit, which Meta measures per ad set. Open a row to see each campaign's real GA4 total beside this audience's share, plus CPC, frequency and click→visit rate.<br>
      <b>Cost/result</b> follows each audience's dominant objective: lead campaigns per lead, message campaigns per conversation started, CPAS per Shopee purchase, everything else per landing page view. Sets under 1,000 impressions are marked <b>too small</b> and sunk below the ranking rather than winning it on one stray result; rows marked ⚠ spent money with zero primary results. Clicks are link clicks, never all-clicks. GA4 can't split visits by ad set, so LPV is the visit measure.</div>
    </div>`;

  $('audSort').addEventListener('change', (e) => { S.audienceSort = e.target.value; S.audienceOpen = null; renderAudiences(); });
  document.querySelectorAll('.aud-row').forEach(r => r.addEventListener('click', () => {
    const i = +r.dataset.i;
    S.audienceOpen = S.audienceOpen === i ? null : i;
    renderAudiences();
  }));
}

function renderGbp() {
  const d = S.gbp;
  if (!d) {
    $('viewRoot').innerHTML = `<div class="card"><div class="state">
      <div class="big">Ready to load reviews</div>
      <div style="max-width:470px;font-size:12.5px;">The range defaults to the last 12 months ending yesterday. Press <b>Load</b>.</div>
    </div></div>`;
    return;
  }
  const list = d.listings || [];
  if (!list.length) { $('viewRoot').innerHTML = errorState('No listings returned for this range.'); return; }
  if (!S.gbpTab || !list.some(l => l.key === S.gbpTab)) S.gbpTab = list[0].key;
  const L = list.find(l => l.key === S.gbpTab);

  const tabStrip = `<div class="acct-tabs">${list.map(l=>`
    <button class="acct-tab ${l.key===S.gbpTab?'active':''}" data-gtab="${esc(l.key)}" title="${esc(l.title)}">
      ${esc(l.key)}<small>${l.allTimeRating!=null?l.allTimeRating.toFixed(1)+'★':''} ${num(l.allTimeCount)}</small>
    </button>`).join('')}</div>`;

  const totalStars = ['s1','s2','s3','s4','s5'].reduce((a,k)=>a+L.stars[k],0);
  const starRow = (k, n_) => {
    const pct = totalStars ? (n_/totalStars)*100 : 0;
    return `<tr>
      <td class="strong" style="width:70px;">${k.slice(1)} ★</td>
      <td style="width:100%"><div style="background:rgba(140,155,190,.13);border-radius:5px;height:9px;overflow:hidden;">
        <div style="width:${pct}%;height:100%;background:${STAR_COLORS[k]};"></div></div></td>
      <td class="num" style="width:70px;">${num(n_)}</td>
      <td class="num" style="width:60px;color:var(--muted)">${totalStars?pct.toFixed(1)+'%':'—'}</td>
    </tr>`;
  };

  $('viewRoot').innerHTML = `
    ${tabStrip}
    ${d.unparsedStars?`<div class="warnbox">${d.unparsedStars} review(s) had a star rating this build couldn't read, so they're excluded from the breakdown.</div>`:''}
    ${L.unlisted?`<div class="warnbox">This listing wasn't in the five you specified, but the account returns it — showing it rather than dropping data.</div>`:''}

    <div class="grid g-5">
      <div class="stat card"><div class="lab">All-time rating</div>
        <div class="val" style="color:${L.allTimeRating>=4.5?'var(--green)':(L.allTimeRating>=4?'var(--amber)':'var(--rose)')}">${L.allTimeRating!=null?L.allTimeRating.toFixed(1)+' ★':'—'}</div>
        <div class="sub">${num(L.allTimeCount)} reviews total</div></div>
      <div class="stat card"><div class="lab">Reviews in period</div>
        <div class="val">${num(L.periodCount)}</div>
        <div class="sub">${esc(d.range.from)} → ${esc(d.range.to)}</div></div>
      <div class="stat card"><div class="lab">Rating in period</div>
        <div class="val">${L.periodRating!=null?L.periodRating.toFixed(2)+' ★':'—'}</div>
        <div class="sub">${L.allTimeRating!=null&&L.periodRating!=null?(L.periodRating>=L.allTimeRating?'at or above':'below')+' all-time':''}</div></div>
      <div class="stat card"><div class="lab">Profile views</div>
        <div class="val ${isNA(L.impressions)?'na':''}">${num(L.impressions)}</div>
        <div class="sub">${num(L.calls)} calls · ${num(L.directions)} directions</div></div>
      <div class="stat card"><div class="lab">1–3★ recently</div>
        <div class="val" style="${L.recentNegatives?'color:var(--rose)':''}">${num(L.recentNegatives)}</div>
        <div class="sub">since ${esc(d.recentFrom)}</div></div>
    </div>

    <div class="card mt">
      <h2>Reviews by month &middot; stars stacked, rating overlaid</h2>
      <div style="height:300px;"><canvas id="gbpChart"></canvas></div>
      <div class="note">Bars stack the count of 1–5★ reviews received each month, 5★ at the base so low ratings stay visible on top; the number above each bar is that month's total. The purple line is the <b>all-time rating as it stood at the end of each month</b> — the score a patient would have seen on Google at that moment — with its value printed above each dot. Hover a month to see that month's own average instead. Reviews predating this range still count toward the line: the opening balance is derived from the listing's all-time total, which Google publishes rounded to one decimal, so the line can sit a fraction of a star off in absolute terms while its trend is exact.${L.cumulativeBasis==='range-only'?' <b>All-time totals were unavailable for this listing, so the line accumulates only from reviews in this range and reads low at the start.</b>':''}</div>
    </div>

    <div class="grid g-2-1 mt">
      <div class="card"><h2>Star distribution &middot; period</h2>
        <table><tbody>${['s5','s4','s3','s2','s1'].map(k=>starRow(k,L.stars[k])).join('')}</tbody></table>
        <div class="note">${num(totalStars)} reviews in the selected range.</div>
      </div>
      <div class="card"><h2>All listings</h2>
        <table><thead><tr><th>Listing</th><th class="num">Rating</th><th class="num">Total</th></tr></thead><tbody>
        ${list.map(l=>`<tr style="${l.key===S.gbpTab?'background:rgba(124,107,245,.05)':''}">
          <td class="strong" style="cursor:pointer" data-gtab2="${esc(l.key)}">${esc(l.key)}<div style="font-size:10px;color:var(--faint);font-weight:400;">${esc(l.title.slice(0,32))}</div></td>
          <td class="num" style="color:${l.allTimeRating>=4.5?'var(--green)':(l.allTimeRating>=4?'var(--amber)':'var(--rose)')};font-weight:600;">${l.allTimeRating!=null?l.allTimeRating.toFixed(1):'—'}</td>
          <td class="num">${num(l.allTimeCount)}</td></tr>`).join('')}
        </tbody></table>
      </div>
    </div>

    ${(L.recent||[]).length?`<div class="card mt no-print">
      <h2>Recent reviews &middot; since ${esc(d.recentFrom)}${L.recentUnreplied?` &middot; ${L.recentUnreplied} without a reply`:''}</h2>
      <table><thead><tr><th style="width:52px;">Stars</th><th>Review</th><th style="width:92px;">Date</th><th style="width:66px;">Replied</th></tr></thead><tbody>
      ${L.recent.map(r=>`<tr>
        <td class="strong" style="color:${r.star>=4?'var(--green)':(r.star==3?'var(--amber)':'var(--rose)')};">${r.star?r.star+' ★':'—'}</td>
        <td class="i18n" style="white-space:normal;font-size:12px;">${r.comment?esc(r.comment):'<span style="color:var(--faint)">rating only, no comment</span>'}
          ${r.reviewer?`<div style="font-size:10.5px;color:var(--faint);margin-top:3px;">${esc(r.reviewer)}</div>`:''}</td>
        <td style="font-size:11px;color:var(--muted)">${esc(String(r.at||'').slice(0,10))}</td>
        <td>${r.replied?'<span class="pill">yes</span>':'<span class="pill warn">no</span>'}</td>
      </tr>`).join('')}
      </tbody></table>
    </div>`:''}
  `;

  document.querySelectorAll('[data-gtab]').forEach(b=>b.addEventListener('click',()=>{ S.gbpTab=b.dataset.gtab; renderGbp(); }));
  document.querySelectorAll('[data-gtab2]').forEach(b=>b.addEventListener('click',()=>{ S.gbpTab=b.dataset.gtab2; renderGbp(); }));

  // stacked stars + rating line
  const el = document.getElementById('gbpChart');
  try {
    if (typeof Chart === 'undefined') throw new Error('chart library unavailable');
    const series = L.series || [];
    S.charts.gbpChart = new Chart(el, {
      plugins: [stackTotalLabels, ratingDotLabels],
      data: {
        labels: series.map(m=>m.label),
        // 5★ first puts it at the base of the stack, so the low ratings sit on
        // top where they're actually visible instead of buried under the green.
        datasets: [
          { type:'line', label:'All-time rating', yAxisID:'y1', _showPointLabels:true,
            data: series.map(m=>m.cumRating),
            borderColor:RATING_LINE, backgroundColor:RATING_LINE, borderWidth:2.5, tension:.35,
            pointRadius:3, pointBackgroundColor:RATING_LINE, pointBorderColor:'#fff', pointBorderWidth:1.5,
            spanGaps:true, order:0 },
          ...['s5','s4','s3','s2','s1'].map(k=>({
            type:'bar', label:`${k.slice(1)}★`, data:series.map(m=>m[k]),
            backgroundColor:STAR_COLORS[k], stack:'stars',
            borderWidth:0, borderColor:'transparent', borderRadius:0, borderSkipped:false,
          })),
        ],
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        layout:{ padding:{ top:16 } },
        interaction:{mode:'index', intersect:false},
        plugins:{
          legend:{ labels:{ color:'#4C5878', font:{family:'Poppins',size:10.5}, usePointStyle:true, boxWidth:8 } },
          tooltip:{ callbacks:{
            // The dot already carries the all-time figure, so the tooltip is
            // free to answer the other question: how did THIS month do?
            label:(c)=>{
              if (c.dataset.type !== 'line') return ` ${c.dataset.label}: ${c.parsed.y}`;
              const m = series[c.dataIndex];
              if (!m || !m.count) return ' This month: no reviews';
              return ` This month: ${(m.ratingSum/m.count).toFixed(2)} ★ from ${m.count} review${m.count>1?'s':''}`;
            },
            footer:(items)=>{
              const m = series[items[0].dataIndex];
              return m && m.cumRating != null ? `All-time after this month: ${m.cumRating.toFixed(2)} ★` : '';
            },
          } },
        },
        scales:{
          x:{ stacked:true, ticks:{ color:'#A7B0C7', font:{family:'Poppins',size:10} }, grid:{ display:false } },
          y:{ stacked:true, beginAtZero:true, title:{display:true,text:'Reviews',color:'#A7B0C7',font:{size:10}},
              ticks:{ color:'#A7B0C7', font:{size:10}, precision:0 }, grid:{ color:'rgba(90,110,160,.09)' } },
          y1:{ position:'right',
               // The running all-time score moves in hundredths, so a full 1-5
               // axis would flatten it into a straight line. Padded around the
               // observed range instead, with the floor never above 4.
               min: (()=>{ const v=series.map(m=>m.cumRating).filter(x=>x!=null); if(!v.length) return 1;
                           return Math.max(1, Math.min(4, Math.floor((Math.min(...v)-0.15)*10)/10)); })(),
               max: 5,
               title:{display:true,text:'Rating (all-time)',color:'#A7B0C7',font:{size:10}},
               ticks:{ color:'#A7B0C7', font:{size:10} }, grid:{ display:false } },
        },
      },
    });
  } catch (e) {
    console.error('gbp chart failed:', e);
    const box = el && el.parentElement;
    if (box) box.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--faint);font-size:12px;">Chart unavailable. The distribution table below still shows the breakdown.</div>`;
  }
}

// ============================================================ BENCHMARK
function renderBenchmark() {
  const d = S.bench;
  if (!d) {
    $('viewRoot').innerHTML = `<div class="card"><div class="state">
      <div class="big">Ready to benchmark</div>
      <div style="max-width:500px;font-size:12.5px;">Press <b>Load</b>. This always reads the last 12 <b>complete</b> calendar months, so a partial month can't flatter the comparison. Results are stored and reused until the month rolls over.</div>
    </div></div>`;
    return;
  }
  const tabs = [d.all, ...(d.accounts || [])];
  if (!S.benchTab || !tabs.some(t => t.id === S.benchTab)) S.benchTab = d.all.id;
  const a = tabs.find(t => t.id === S.benchTab) || d.all;
  const isAll = a.id === '__all__';

  const tabStrip = `<div class="acct-tabs">${tabs.map(t => `
    <button class="acct-tab ${t.id===S.benchTab?'active':''}" data-tab="${esc(t.id)}">
      ${esc(t.account)}<small>${num(t.spend3m,{money:true})}</small>
    </button>`).join('')}</div>`;

  const chip = (cell, lowerIsBetter) => {
    if (!cell) return '<span style="color:var(--faint)">—</span>';
    const p = cell.deltaPct;
    const good = lowerIsBetter ? p < 0 : p > 0;
    const flat = Math.abs(p) < 2;
    const col = flat ? 'var(--muted)' : (good ? 'var(--green)' : 'var(--rose)');
    return `<span style="color:${col};font-weight:600;">${flat?'':(p>0?'▲':'▼')} ${Math.abs(p).toFixed(0)}%</span>`;
  };
  const fmt = (v, money) => v == null ? '—' : (money ? num(v,{money:true}) : num(v,{dp:2}));

  $('viewRoot').innerHTML = `

      <div class="stat card"><div class="lab">Avg monthly spend · 3M</div>
        <div class="val">${w.m3?num(w.m3.avgMonthlySpend,{money:true}):'—'}</div>
        <div class="sub">${w.m3?`${w.m3.months} month${w.m3.months>1?'s':''} with data`:''}</div></div>
      <div class="stat card"><div class="lab">Avg monthly spend · 6M</div>

        <div class="sub">${w.m6?`${w.m6.months} months`:''}</div></div>

    ${(a.goals||[]).length?`<div class="card mt">
      <h2>Efficiency by campaign objective · last 12 months</h2>
      <table><thead><tr><th>Objective</th><th class="num">Spend</th><th class="num">Results</th>
        <th class="num">Cost per result</th><th class="num">Results / ฿1k</th><th class="num">CPM</th></tr></thead><tbody>
      ${a.goals.map(g=>`<tr>

        <td class="num">${num(g.spend,{money:true})}</td>

      </tr>`).join('')}
      </tbody></table>
      <div class="note">Each objective is judged on its own result, because a shared metric would be meaningless across them: a lead-form ad never sends anyone to the site, so cost per visit doesn't apply, and a message ad's outcome is a conversation. Results marked <b>from Meta</b> are counted by the platform and survive missing utm tags; results <b>from GA4</b> depend on correct tagging. Objective comes from Meta's own <code>campaign_objective</code>, falling back to the campaign name only when that's blank.</div>
    </div>`:''}

    <div class="card mt">
      <h2>${esc(a.latestMonth?a.latestMonth.label:'Latest month')} vs trailing norms${isAll?'':' · '+esc(a.account)}</h2>
      <table><thead><tr>
        <th>Metric</th><th class="num">Latest</th>
        <th class="num">3M</th><th class="num">vs</th>
        <th class="num">6M</th><th class="num">vs</th>
        <th class="num">12M</th><th class="num">vs</th>
      </tr></thead><tbody>
      ${(a.comparison||[]).map(m=>`<tr>
        <td class="strong">${esc(m.label)}</td>
        <td class="num" style="font-weight:600;color:var(--ink)">${fmt(m.current,m.money)}</td>
        <td class="num">${fmt(m.vs.m3?m.vs.m3.base:null,m.money)}</td><td class="num">${chip(m.vs.m3,m.lowerIsBetter)}</td>
        <td class="num">${fmt(m.vs.m6?m.vs.m6.base:null,m.money)}</td><td class="num">${chip(m.vs.m6,m.lowerIsBetter)}</td>
        <td class="num">${fmt(m.vs.m12?m.vs.m12.base:null,m.money)}</td><td class="num">${chip(m.vs.m12,m.lowerIsBetter)}</td>
      </tr>`).join('')||'<tr><td colspan="8" class="num">no comparable months</td></tr>'}
      </tbody></table>
      <div class="note">Green means favourable, not upward — a fall in cost per contact is green, a fall in results per ฿1,000 is red. Window figures derive from summed totals across the window, so a quiet month can't swing the norm as hard as a heavy one. Deltas under 2% show without an arrow.${isAll?'':' Site metrics for a single account are attributed by matching the campaign code in its ad names against tagged utm_campaign values, so untagged campaigns in this account are absent from visit-based rows.'}</div>

        const empty=!m.spend&&!m.visits;
        return `<tr${empty?' style="opacity:.45"':''}>

        <td class="num">${num(m.spend,{money:true})}</td>
        <td class="num">${num(m.impressions)}</td>
        <td class="num">${num(m.clicks)}</td>
        <td class="num">${num(m.leads)}</td>
        <td class="num">${num(m.messages)}</td>
        ${isAll?`<td class="num">${num(m.visits)}</td><td class="num">${num(m.keyEvents)}</td>`:''}
        <td class="num">${num(m.cpm,{money:true})}</td>
        <td class="num">${num(m.cpc,{money:true})}</td>
      </tr>`}).join('')}
      </tbody></table>
    </div>

    <div class="note" style="margin-top:12px;">Computed ${esc((d.computedAt||'').slice(0,16).replace('T',' '))} · stored for ${esc(d.storedFor||'')} (${esc(d.store||'memory')}) · reused until the month rolls over. Press Load to force a recompute.</div>
  `;

  document.querySelectorAll('.acct-tab').forEach(b => b.addEventListener('click', () => {
    S.benchTab = b.dataset.tab; renderBenchmark();
  }));

  const rows = (a.series||[]).filter(m=>m.spend||m.visits).map(m=>({

  drawChart('benchChart', rows, [
    { label:'Spend', key:'spend', color:'#F2A93B', axis:'y' },

}

// ============================================================ AUDIT
function renderAudit() {
  const d = S.audit;
  if (!d) {
    $('viewRoot').innerHTML = `<div class="card"><div class="state">
      <div class="big">Ready to audit</div>
      <div style="max-width:460px;font-size:12.5px;">Press <b>Load</b> to measure how much traffic and ad spend can't be tied to a campaign code — the blind spot in the Campaigns view.</div>
    </div></div>`;
    return;
  }
  const tr = d.traffic, sp = d.spend;
  const shareBad = tr.untaggedShare != null && tr.untaggedShare >= 10;

  $('viewRoot').innerHTML = `
    <div class="grid g-4">
      <div class="stat card"><div class="lab">Untagged visits</div>
        <div class="val" style="${shareBad?'color:var(--rose)':''}">${num(tr.untaggedVisits)}</div>
        <div class="sub">${tr.untaggedShare!=null?num(tr.untaggedShare,{pct:true})+' of all campaign traffic':''}</div></div>
      <div class="stat card"><div class="lab">Key events lost to it</div>
        <div class="val">${num(tr.untaggedKeyEvents)}</div>
        <div class="sub">can't be credited to any campaign</div></div>
      <div class="stat card"><div class="lab">Unattributable ad spend</div>
        <div class="val ${isNA(sp.unmatched)?'na':''}" style="${sp.unmatchedShare>=10?'color:var(--rose)':''}">${num(sp.unmatched,{money:true})}</div>
        <div class="sub">${sp.unmatchedShare!=null?num(sp.unmatchedShare,{pct:true})+' of '+num(sp.total,{money:true}):''}</div></div>
      <div class="stat card"><div class="lab">Codes tracking properly</div>
        <div class="val">${num(d.taggedCodes)}</div>
        <div class="sub">${num(tr.taggedVisits)} visits</div></div>
    </div>

    <div class="card mt">
      <h2>Traffic that can't be attributed</h2>
      <table><thead><tr><th>Cause</th><th class="num">Visits</th><th class="num">Key events</th><th>Examples</th></tr></thead><tbody>
      ${(tr.issues||[]).map(i=>`<tr>
        <td class="strong" style="max-width:330px;white-space:normal;">${esc(i.label)}</td>
        <td class="num">${num(i.visits)}</td><td class="num">${num(i.keyEvents)}</td>
        <td class="i18n" style="font-size:11px;color:var(--muted);max-width:300px;white-space:normal;">${i.examples.map(e=>`<code>${esc(e)}</code>`).join(', ')}</td>
      </tr>`).join('')||'<tr><td colspan="4" class="num">Nothing untagged in this range — tagging is clean.</td></tr>'}
      </tbody></table>
      <div class="note">Each row is a distinct failure mode, not a severity ranking. A bare platform ID means the ad's destination URL carried no <code>utm_campaign</code>, so GA4 recorded the platform's own campaign ID instead — those sessions are real, they just can't be grouped with the campaign they belong to.</div>
    </div>

    ${(sp.unmatchedCampaigns||[]).length?`<div class="card mt slide-break">
      <h2>Ad spend with no matching tagged campaign</h2>
      <table><thead><tr><th>Ad campaign</th><th>Account</th><th class="num">Impr</th><th class="num">Clicks</th><th class="num">Spend</th></tr></thead><tbody>
      ${sp.unmatchedCampaigns.map(c=>`<tr>
        <td class="strong i18n trunc" title="${esc(c.name)}">${esc(c.name)}</td>
        <td style="font-size:11px;color:var(--muted)">${esc(c.account)}</td>
        <td class="num">${num(c.impressions)}</td><td class="num">${num(c.clicks)}</td>
        <td class="num">${num(c.spend,{money:true})}</td>
      </tr>`).join('')}
      </tbody></table>
      <div class="note">These ad campaigns either carry no <code>YYMMDD-NN</code> code in their name, or carry one that no tagged utm_campaign matches. Their spend can be totalled but never linked to visits, key events or revenue — so it sits outside every efficiency figure in this dashboard.</div>
    </div>`:''}

    <div class="card mt">
      <h2>How to fix it</h2>
      <div style="font-size:12.5px;color:var(--ink-2);line-height:1.75;">
        <b>Bare platform IDs</b> — the ad's destination URL is missing <code>utm_campaign</code>. Add the code to the link when the ad is built; Meta won't backfill it, so historic sessions stay unattributable.<br>
        <b>Placeholders</b> — a template variable reached production unsubstituted. Worth a pre-launch check on the link, since it silently costs the whole campaign's attribution.<br>
        <b>Names without a code</b> — the ad ran with a name that doesn't follow <code>YYMMDD-NN</code>, so it can't be searched or dated here. Renaming in the platform fixes future reporting.
      </div>
    </div>
  `;
}

// ============================================================ charts
/**
 * Funnel as a log-scale bar chart. On a linear axis, 2.5K key events beside
 * 344.8K impressions is a bar one pixel tall; a log axis makes every stage
 * readable at once. Zero and null are dropped because log(0) is undefined.
 */
// Draws each bar's value at its end, so nobody has to hover. Values that
// would collide with the chart edge move inside the bar in white.
const barValueLabels = {
  id: 'barValueLabels',
  afterDatasetsDraw(chart) {
    const { ctx, chartArea } = chart;
    const horizontal = chart.options.indexAxis === 'y';
    chart.data.datasets.forEach((ds, di) => {
      const meta = chart.getDatasetMeta(di);
      if (meta.type !== 'bar' || meta.hidden) return;
      meta.data.forEach((el, i) => {
        const v = ds.data[i];
        if (v == null) return;
        const txt = Number(v).toLocaleString();
        ctx.save();
        ctx.font = '600 10.5px Poppins, sans-serif';
        if (horizontal) {
          const fitsOutside = el.x + 8 + ctx.measureText(txt).width < chartArea.right - 2;
          ctx.textAlign = fitsOutside ? 'left' : 'right';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = fitsOutside ? '#4C5878' : '#fff';
          ctx.fillText(txt, fitsOutside ? el.x + 8 : el.x - 8, el.y);
        } else {
          const fitsAbove = el.y - 8 > chartArea.top + 10;
          ctx.textAlign = 'center';
          ctx.textBaseline = fitsAbove ? 'bottom' : 'top';
          ctx.fillStyle = fitsAbove ? '#4C5878' : '#fff';
          ctx.fillText(txt, el.x, fitsAbove ? el.y - 4 : el.y + 4);
        }
        ctx.restore();
      });
    });
  },
};

function drawFunnelChart(canvasId, stages) {
  const el = document.getElementById(canvasId);
  if (!el) return;
  const usable = stages.filter(s => s.value != null && s.value > 0);
  if (!usable.length) {
    const box = el.parentElement;
    if (box) box.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--faint);font-size:12px;">No funnel data for this campaign.</div>';
    return;
  }
  try {
    if (typeof Chart === 'undefined') throw new Error('chart library unavailable');
    S.charts[canvasId] = new Chart(el, {
      type: 'bar',
      plugins: [barValueLabels],
      data: { labels: usable.map(s=>s.label), datasets: [{
        data: usable.map(s=>s.value),
        backgroundColor: usable.map(s=>s.color),
        borderRadius: 6, borderSkipped: false, barPercentage: .72,
      }]},
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (c) => ` ${c.parsed.x.toLocaleString()}` } },
        },
        scales: {
          x: { type: 'logarithmic', ticks: { color:'#A7B0C7', font:{family:'Poppins',size:10},
                 callback: (v) => { const l=Math.log10(v); return Number.isInteger(l) ? (v>=1000?(v/1000)+'k':v) : ''; } },
               grid: { color:'rgba(90,110,160,.09)' } },
          y: { ticks: { color:'#4C5878', font:{family:'Poppins',size:11} }, grid: { display:false } },
        },
      },
    });
  } catch (e) {
    console.error('funnel chart failed:', e);
    const box = el.parentElement;
    if (box) box.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--faint);font-size:12px;">Chart unavailable. Figures are in the table below.</div>`;
  }
}

function drawChart(canvasId, rows, series) {
  const el = document.getElementById(canvasId);
  if (!el) return;
  try {
    if (typeof Chart === 'undefined') throw new Error('chart library unavailable');
    S.charts[canvasId] = new Chart(el, {
      type: 'line',
      data: {
        labels: rows.map(r => r.d),
        datasets: series.map(s => ({
          label: s.label, data: rows.map(r => r[s.key]),
          borderColor: s.color, backgroundColor: s.color + '22',
          tension: .35, fill: s.axis === 'y', yAxisID: s.axis, pointRadius: 0, borderWidth: 2,
        })),
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { labels: { color:'#4C5878', font:{family:'Poppins',size:11}, usePointStyle:true, boxWidth:7 } } },
        scales: {
          x: { ticks:{ color:'#A7B0C7', font:{family:'Poppins',size:10}, maxRotation:0, autoSkip:true, maxTicksLimit:8 }, grid:{ color:'rgba(90,110,160,.09)' } },
          y: { position:'left', ticks:{ color:'#A7B0C7', font:{size:10} }, grid:{ color:'rgba(90,110,160,.09)' } },
          y1:{ position:'right', ticks:{ color:'#A7B0C7', font:{size:10} }, grid:{ display:false } },
        },
      },
    });
  } catch (e) {
    console.error('chart failed:', e);
    const box = el.parentElement;
    if (box) box.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--faint);font-size:12px;text-align:center;">Chart unavailable (${esc(e.message)}).<br>Figures above are still live.</div>`;
  }
}

$('printBtn').addEventListener('click', () => {
  const [t] = TITLES[S.view];
  const extra = S.view === 'campaigns' && S.campaign ? ` — ${S.campaign.topic || S.campaign.code}` : '';
  $('printTitle').textContent = t + extra;

if (typeof Chart !== 'undefined') {
  Chart.defaults.font.family = 'Poppins, sans-serif';

fetch('/api/version').then(r => r.json()).then(v => {
  $('verLabel').textContent = 'v' + v.version + (v.modelArmor ? ' · armor on' : '');
}).catch(() => { $('verLabel').textContent = 'unknown'; });

// Identity decides the nav before anything renders, so a user never glimpses a
// tab they can't open.
fetch('/api/me').then(r => r.json()).then(me => {
  S.me = me;
  document.querySelectorAll('.nav-item').forEach(item => {
    const allowed = me.tabs.includes(item.dataset.view);
    item.classList.toggle('hidden', !allowed);
  });
  // A grouping heading with every child hidden is just a stray word, and two
  // separators with nothing between them read as a rendering fault — so both
  // collapse when the person's permissions empty the section out.
  document.querySelectorAll('.nav-group').forEach(g => {
    const kids = [];
    for (let el = g.nextElementSibling; el && el.classList.contains('nav-item'); el = el.nextElementSibling) {
      if (el.classList.contains('sub')) kids.push(el);
    }
    g.classList.toggle('hidden', kids.length > 0 && kids.every(k => k.classList.contains('hidden')));
  });
  document.querySelectorAll('.nav-sep').forEach(sep => {
    let next = sep.nextElementSibling, visibleBelow = false;
    while (next && !next.classList.contains('nav-sep')) {
      if (!next.classList.contains('hidden')) { visibleBelow = true; break; }
      next = next.nextElementSibling;
    }
    sep.classList.toggle('hidden', !visibleBelow);
  });
  if (me.email) {
    const foot = document.querySelector('.rail-foot');
    if (foot) foot.insertAdjacentHTML('afterbegin',
      `<div class="k">Signed in</div><div class="v" style="word-break:break-all;">${esc(me.email)}${me.isAdmin?' <span class="pill">admin</span>':''}</div>`);
  }
  const wanted = location.hash.slice(1);
  const start = (wanted && me.tabs.includes(wanted)) ? wanted : (me.tabs.find(t => t !== 'users') || me.tabs[0]);
  if (!start) {
    $('viewRoot').innerHTML = `<div class="card"><div class="state"><div class="big">No tabs assigned</div>
      <div style="max-width:420px;font-size:12.5px;">Your account is signed in${me.email?` as ${esc(me.email)}`:''} but hasn't been granted any views yet. Ask an admin to grant access.</div></div></div>`;
    return;
  }
  goTo(start, { push: !location.hash });
  render();
}).catch(() => {
  // Identity unavailable (local dev, or IAP not in front): show everything.
  S.me = { email: null, isAdmin: true, tabs: ['overview','campaigns','gbp','benchmark','audit','topics','users'], allTabs: [] };
  goTo(location.hash.slice(1) || 'overview', { push: false });
  render();
});
